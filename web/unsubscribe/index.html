<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsubscribe — True Path Sourcing</title>
  <style>
    body { margin:0; background:#f2f5f5; font-family:Arial,Helvetica,sans-serif; color:#1e293b;
      display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; max-width:460px; width:100%;
      text-align:center; overflow:hidden; box-shadow:0 6px 24px rgba(16,32,30,.08); }
    .head { background:#0d7d74; padding:20px; }
    .head img { max-width:200px; height:auto; }
    .body { padding:28px 26px; font-size:15px; line-height:1.6; }
    .body b { word-break:break-all; }
    button { background:#0d7d74; color:#fff; border:0; border-radius:8px; padding:11px 20px;
      font-size:14px; font-weight:600; cursor:pointer; margin-top:14px; }
    button:hover { background:#0a5e57; }
    button:disabled { opacity:.6; cursor:default; }
    .muted { color:#94a3b8; font-size:12.5px; margin-top:18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="head"><img src="https://app.truepathsourcing.com/assets/img/truepath-logo.png" alt="True Path Sourcing"></div>
    <div class="body" id="content">Loading…</div>
  </div>
<script>
  const p = new URLSearchParams(location.search);
  const email = (p.get('e') || '').trim();
  const t = p.get('t') || '';
  const content = document.getElementById('content');
  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  async function init() {
    if (!email) { content.innerHTML = 'This unsubscribe link is missing information.'; return; }
    let r = {};
    try { r = await fetch('/.netlify/functions/unsubscribe?e=' + encodeURIComponent(email) + '&t=' + encodeURIComponent(t)).then(x => x.json()); } catch {}
    if (r.opted_out) { done(); return; }
    if (!r.valid) { content.innerHTML = 'This unsubscribe link is invalid or has expired.<p class="muted">Questions? Call us at 877-546-6378.</p>'; return; }
    content.innerHTML = `<p>Unsubscribe <b>${esc(email)}</b> from True Path Sourcing emails?</p>
      <button id="btn">Unsubscribe</button>
      <p class="muted">You will no longer receive marketing emails from us.</p>`;
    document.getElementById('btn').onclick = confirmUnsub;
  }
  async function confirmUnsub() {
    const btn = document.getElementById('btn'); btn.disabled = true; btn.textContent = 'Unsubscribing…';
    let r = {};
    try { r = await fetch('/.netlify/functions/unsubscribe', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ e: email, t }) }).then(x => x.json()); } catch {}
    if (r.ok) done();
    else content.innerHTML = 'Sorry, something went wrong. Please call us at 877-546-6378.';
  }
  function done() {
    content.innerHTML = `<p><b>You've been unsubscribed.</b></p><p>${esc(email)} will no longer receive True Path Sourcing marketing emails.</p><p class="muted">Questions? Call us at 877-546-6378.</p>`;
  }
  init();
</script>
</body>
</html>
