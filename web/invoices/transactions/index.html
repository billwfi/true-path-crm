<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions — True Path CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="bg-slate-100 text-slate-700">
<div id="app" class="flex h-screen overflow-hidden">
  <div id="nav-placeholder"></div>
  <div class="flex-1 flex flex-col overflow-hidden">
    <div id="topbar"></div>
    <main class="flex-1 overflow-y-auto p-6">

      <div class="search-bar mb-1">
        <span class="text-lg font-semibold">Transactions</span>
        <span class="ml-2 text-sm text-slate-400">Pulled from Unifeyed · tie to a group &amp; log payments</span>
      </div>
      <div class="text-xs text-slate-400 mb-3" id="scope"></div>

      <!-- Summary tiles -->
      <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4" id="tiles">
        <div class="card"><div class="card-body p-4"><div class="text-xs uppercase tracking-wide text-slate-400">Transactions</div><div class="text-2xl font-semibold" id="t-txns">—</div></div></div>
        <div class="card"><div class="card-body p-4"><div class="text-xs uppercase tracking-wide text-slate-400">Resolved to client</div><div class="text-2xl font-semibold text-sky-700" id="t-matched">—</div></div></div>
        <div class="card"><div class="card-body p-4"><div class="text-xs uppercase tracking-wide text-slate-400">Total amount</div><div class="text-2xl font-semibold" id="t-amount">—</div></div></div>
        <div class="card"><div class="card-body p-4"><div class="text-xs uppercase tracking-wide text-slate-400">Paid</div><div class="text-2xl font-semibold text-emerald-600" id="t-paid">—</div></div></div>
        <div class="card"><div class="card-body p-4"><div class="text-xs uppercase tracking-wide text-slate-400">Outstanding</div><div class="text-2xl font-semibold text-amber-600" id="t-out">—</div></div></div>
      </div>

      <!-- Filters -->
      <div class="card mb-4"><div class="card-body p-3">
        <div class="flex flex-wrap items-center gap-2">
          <select class="form-control" style="max-width:160px" id="f-window" onchange="reload()">
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
            <option value="365">Last 12 months</option>
            <option value="all">All dates</option></select>
          <select class="form-control" style="max-width:280px" id="f-group" onchange="reload()"><option value="">All groups</option></select>
          <select class="form-control" style="max-width:150px" id="f-status" onchange="reload()"><option value="">All statuses</option></select>
          <select class="form-control" style="max-width:170px" id="f-paid" onchange="reload()">
            <option value="">Any payment state</option><option value="unpaid">Unpaid</option>
            <option value="partial">Partially paid</option><option value="paid">Paid in full</option></select>
          <select class="form-control" style="max-width:180px" id="f-resolved" onchange="reload()">
            <option value="">Resolution: any</option><option value="1">Resolved to client</option><option value="0">Unresolved</option></select>
          <input class="form-control" style="flex:1;min-width:180px" id="f-search" placeholder="Search patient, order #, drug, cardholder…" oninput="debounced()">
          <button class="btn btn-outline" onclick="exportRows()"><i class="fa-solid fa-file-excel"></i> Export</button>
        </div>
      </div></div>

      <div class="card"><div class="card-body p-0">
        <div style="overflow-x:auto">
        <table class="data-table" style="min-width:1100px"><thead><tr>
          <th>Order #</th><th>Patient</th><th>Client / Group</th><th>Drug</th><th>Qty</th><th>Date</th>
          <th class="text-right">Amount</th><th class="text-right">Paid</th><th class="text-right">Balance</th>
          <th>Status</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="11" class="text-center py-8 text-slate-400">Loading…</td></tr></tbody></table></div>
        <div class="p-2 text-xs text-slate-400" id="rowcap"></div>
      </div></div>

    </main>
  </div>
</div>

<!-- Log Payment modal -->
<div id="payModal" class="modal-backdrop hidden"><div class="modal"><div class="modal-header">
  <span class="modal-title">Log Payment</span><button class="modal-close" onclick="hideModal('payModal')">&times;</button></div>
  <div class="modal-body">
    <div id="pay-ctx" class="mb-3 text-sm text-slate-500"></div>
    <div class="form-grid">
      <div class="form-group"><label class="form-label">Amount *</label><input class="form-control" id="p-amount" type="number" step="0.01" min="0"></div>
      <div class="form-group"><label class="form-label">Date</label><input class="form-control" id="p-date" type="date"></div>
      <div class="form-group"><label class="form-label">Method</label>
        <select class="form-control" id="p-method"><option value="">—</option><option>ACH</option><option>Check</option><option>Wire</option><option>Card</option><option>Other</option></select></div>
      <div class="form-group"><label class="form-label">Reference</label><input class="form-control" id="p-reference" placeholder="check #, ACH trace…"></div>
    </div>
    <div class="form-group"><label class="form-label">Note</label><textarea class="form-control" id="p-note" rows="2"></textarea></div>
    <div id="pay-history"></div>
  </div>
  <div class="modal-footer"><button class="btn btn-outline" onclick="hideModal('payModal')">Cancel</button>
    <button class="btn btn-primary" onclick="savePayment()">Log Payment</button></div></div></div>

<script src="/assets/js/app.js"></script>
<script>
  initNav('invoices-transactions');
  let rowsCache = [], curTxn = null, sDebounce;
  const fmt = n => '$' + (Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  const escv = s => (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function showModal(id){ document.getElementById(id).classList.remove('hidden'); }
  function hideModal(id){ document.getElementById(id).classList.add('hidden'); }
  function debounced(){ clearTimeout(sDebounce); sDebounce=setTimeout(reload,300); }

  function qs(){
    const p = new URLSearchParams();
    const g=val('f-group'), st=val('f-status'), pd=val('f-paid'), rz=val('f-resolved'), s=val('f-search'), w=val('f-window');
    if(g)p.set('group',g); if(st)p.set('status',st); if(pd)p.set('paid',pd);
    if(rz)p.set('resolved',rz); if(s)p.set('search',s);
    if(w && w!=='all')p.set('days',w);
    return p.toString();
  }
  function val(id){ return document.getElementById(id).value.trim(); }

  async function loadSummary(){
    const g=val('f-group'), w=val('f-window');
    const p=new URLSearchParams(); if(g)p.set('group',g); if(w && w!=='all')p.set('days',w);
    const s=await apiGet('/uf-transactions?resource=summary&'+p.toString()).catch(()=>null);
    if(!s)return;
    document.getElementById('t-txns').textContent=(s.txns||0).toLocaleString();
    document.getElementById('t-matched').textContent=(s.resolved||0).toLocaleString();
    document.getElementById('t-amount').textContent=fmt(s.amount);
    document.getElementById('t-paid').textContent=fmt(s.paid);
    document.getElementById('t-out').textContent=fmt((s.amount||0)-(s.paid||0));
  }

  async function loadGroups(){
    const g=await apiGet('/uf-transactions?resource=groups').catch(()=>[]);
    const opts=(g||[]).map(x=>{
      const label=(x.group_name?x.group_name+' — ':'')+x.group_id+' ('+x.txns+' · '+fmt(x.amount)+')'+(x.matched?'':' ⚠');
      return `<option value="${escv(x.group_id)}">${escv(label)}</option>`;
    }).join('');
    document.getElementById('f-group').innerHTML='<option value="">All groups</option>'+opts;
    // status options from current rows are populated after first load
  }

  function updateScope(){
    const w=document.getElementById('f-window'), g=document.getElementById('f-group');
    const wl=w.options[w.selectedIndex].text;
    const gl=g.value ? g.options[g.selectedIndex].text.replace(/\s*\(.*$/,'') : 'all groups';
    document.getElementById('scope').textContent = `Tiles & list reflect: ${wl} · ${gl}`;
  }

  async function reload(){
    updateScope();
    await loadSummary();
    const data=await apiGet('/uf-transactions?'+qs()).catch(()=>[]);
    rowsCache=data||[];
    // build status filter from the data the first time it's empty
    const sel=document.getElementById('f-status');
    if(sel.options.length<=1){
      const set=[...new Set(rowsCache.map(r=>r.status).filter(Boolean))].sort();
      sel.innerHTML='<option value="">All statuses</option>'+set.map(s=>`<option>${escv(s)}</option>`).join('');
    }
    renderRows();
  }

  function payState(r){
    const paid=Number(r.paid)||0, amt=Number(r.amount)||0;
    if(amt>0 && paid>=amt) return '<span class="badge badge-green">Paid</span>';
    if(paid>0) return '<span class="badge badge-orange">Partial</span>';
    return '<span class="badge badge-gray">Unpaid</span>';
  }

  function renderRows(){
    const b=document.getElementById('rows');
    document.getElementById('rowcap').textContent = rowsCache.length>=500
      ? 'Showing the first 500 matching transactions — narrow with filters.'
      : `${rowsCache.length.toLocaleString()} transaction(s)`;
    b.innerHTML = rowsCache.length ? rowsCache.map((r,i)=>`<tr>
      <td class="font-mono text-xs">${escv(r.order_number)||('#'+r.source_id)}</td>
      <td>${escv((r.patient_last||'')+', '+(r.patient_first||'')).replace(/^, |, $/,'')||'—'}</td>
      <td>${r.resolved_company
            ? `<div class="font-medium">${escv(r.resolved_company)}</div><div class="text-xs text-slate-400 font-mono">${escv(r.tp_group_id)||''} · grp ${escv(r.group_id)}</div>`
            : (r.group_id
                ? `<span class="text-amber-600 text-xs">unresolved</span><div class="text-xs text-slate-400 font-mono">grp ${escv(r.group_id)}</div>`
                : '<span class="text-slate-300">—</span>')}</td>
      <td>${escv(r.drug)||'—'}<div class="text-xs text-slate-400">${escv(r.strength)||''}</div></td>
      <td class="text-xs">${r.reporting_qty!=null?escv(r.reporting_qty):''} ${escv(r.reporting_unit)||''}</td>
      <td class="text-xs">${escv(r.date_ordered)||'—'}</td>
      <td class="text-right font-medium tabular-nums">${fmt(r.amount)}</td>
      <td class="text-right tabular-nums ${Number(r.paid)>0?'text-emerald-600':'text-slate-400'}">${fmt(r.paid)}</td>
      <td class="text-right tabular-nums ${Number(r.balance)>0?'text-amber-600':''}">${fmt(r.balance)}</td>
      <td>${payState(r)}</td>
      <td class="text-right whitespace-nowrap">
        <button class="btn btn-outline btn-sm" onclick="openPay(${i})"><i class="fa-solid fa-dollar-sign"></i> Payment${r.payment_count>0?' ('+r.payment_count+')':''}</button>
      </td></tr>`).join('')
      : '<tr><td colspan="11" class="text-center py-8 text-slate-400">No transactions match these filters</td></tr>';
  }

  async function openPay(i){
    const r=rowsCache[i]; curTxn=r;
    document.getElementById('pay-ctx').innerHTML =
      `<b>${escv((r.patient_first||'')+' '+(r.patient_last||''))}</b> · ${escv(r.drug)||''} `+
      `· order ${escv(r.order_number)||('#'+r.source_id)}<br>Amount ${fmt(r.amount)} · Paid ${fmt(r.paid)} · `+
      `<b>Balance ${fmt(r.balance)}</b>${r.group_id?' · group '+escv(r.group_id):''}`;
    document.getElementById('p-amount').value = (Number(r.balance)>0?Number(r.balance).toFixed(2):'');
    document.getElementById('p-date').value=''; document.getElementById('p-method').value='';
    document.getElementById('p-reference').value=''; document.getElementById('p-note').value='';
    document.getElementById('pay-history').innerHTML='';
    showModal('payModal');
    if(r.payment_count>0){
      const h=await apiGet('/uf-transactions?resource=payments&transaction_id='+r.id).catch(()=>[]);
      document.getElementById('pay-history').innerHTML = (h&&h.length)?
        '<div class="text-xs uppercase tracking-wide text-slate-400 mt-3 mb-1">Payments</div>'+
        h.map(p=>`<div class="flex justify-between text-sm border-b border-slate-100 py-1">
          <span>${fmt(p.amount)} ${p.method?'· '+escv(p.method):''} ${p.reference?'· '+escv(p.reference):''}</span>
          <span class="text-slate-400">${p.paid_date?escv(String(p.paid_date).slice(0,10)):''}
            <button class="text-red-400 ml-2" title="delete" onclick="delPay(${p.id})">&times;</button></span></div>`).join('') : '';
    }
  }

  async function savePayment(){
    if(!curTxn)return;
    const amount=parseFloat(document.getElementById('p-amount').value);
    if(!(amount>0))return showToast('Enter an amount','error');
    const body={ transaction_id:curTxn.id, amount,
      paid_date:val('p-date')||null, method:val('p-method')||null,
      reference:val('p-reference')||null, note:val('p-note')||null };
    const r=await apiPost('/uf-transactions?resource=payment', body);
    if(r&&r.id){ showToast('Payment logged'); hideModal('payModal'); reload(); }
    else showToast('Save failed','error');
  }
  async function delPay(id){
    if(!confirm('Delete this payment?'))return;
    const r=await apiDelete('/uf-transactions?resource=payment&id='+id);
    if(r&&r.deleted){ showToast('Deleted'); hideModal('payModal'); reload(); }
  }

  function exportRows(){
    if(!rowsCache.length)return showToast('Nothing to export','error');
    const header=['Order #','Patient','Client','TP Group','Group ID','Drug','Strength','Qty','Unit','Date Ordered','Shipped','Amount','Paid','Balance','Status'];
    const body=rowsCache.map(r=>[r.order_number||('#'+r.source_id),
      ((r.patient_last||'')+', '+(r.patient_first||'')).replace(/^, |, $/,''),
      r.resolved_company||'', r.tp_group_id||'', r.group_id||'',
      r.drug||'', r.strength||'', r.reporting_qty??'', r.reporting_unit||'',
      r.date_ordered||'', r.shipped_date||'', Number(r.amount)||0, Number(r.paid)||0, Number(r.balance)||0, r.status||'']);
    const ws=XLSX.utils.aoa_to_sheet([header,...body]);
    ws['!cols']=header.map(h=>({wch:Math.max(9,h.length+2)}));
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Transactions');
    XLSX.writeFile(wb,`transactions-${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  (async()=>{ await loadGroups(); await reload(); })();
</script>
</body>
</html>
