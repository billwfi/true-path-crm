<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intake Types — True Path CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="bg-slate-100 text-slate-700">
<div id="app" class="flex h-screen overflow-hidden">
  <div id="nav-placeholder"></div>
  <div class="flex-1 flex flex-col overflow-hidden">
    <div id="topbar"></div>
    <main class="flex-1 overflow-y-auto p-6">

      <div class="search-bar mb-4">
        <span class="text-lg font-semibold">Intake Types</span>
        <span class="ml-2 text-sm text-slate-400">The service types the concierge intake engine assigns &amp; works (GLP-1 or non-GLP-1)</span>
        <button class="btn btn-primary ml-auto" onclick="openNew()"><i class="fa-solid fa-plus"></i> New Type</button>
      </div>

      <div id="cards" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="text-slate-400 text-sm">Loading…</div>
      </div>
    </main>
  </div>
</div>

<div id="tModal" class="modal-backdrop hidden"><div class="modal modal-lg"><div class="modal-header">
  <span class="modal-title" id="t-title">Intake Type</span><button class="modal-close" onclick="hideModal('tModal')">&times;</button></div>
  <div class="modal-body">
    <div class="form-grid">
      <div class="form-group"><label class="form-label">Code *</label><input class="form-control" id="t-code" placeholder="e.g. NONGLP1">
        <p class="text-xs text-slate-400 mt-1">Matches the category on claims/intake records.</p></div>
      <div class="form-group"><label class="form-label">Name *</label><input class="form-control" id="t-name"></div>
      <div class="form-group full"><label class="form-label">Description</label><input class="form-control" id="t-description"></div>
      <div class="form-group full"><label class="form-label">Status Lifecycle</label>
        <textarea class="form-control" id="t-statuses" rows="4" placeholder="One status per line, in order"></textarea>
        <p class="text-xs text-slate-400 mt-1">The order a concierge advances an intake through.</p></div>
      <div class="form-group full"><label class="form-label">Sub-statuses (advanced, JSON)</label>
        <textarea class="form-control font-mono text-xs" id="t-sub" rows="3" placeholder='{"Registered for Services":["Order Created"]}'></textarea></div>
      <div class="form-group"><label class="form-label">Color</label><input class="form-control" id="t-color" placeholder="#1f5f8b"></div>
      <div class="form-group"><label class="form-label">Sort</label><input class="form-control" id="t-sort" type="number"></div>
      <div class="form-group"><label class="form-label">GLP-1 type</label><select class="form-control" id="t-glp"><option value="0">No</option><option value="1">Yes</option></select></div>
      <div class="form-group"><label class="form-label">Status</label><select class="form-control" id="t-active"><option value="1">Active</option><option value="0">Inactive</option></select></div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-outline text-red-500 mr-auto" id="t-del" onclick="delType()" style="display:none">Delete</button>
    <button class="btn btn-outline" onclick="hideModal('tModal')">Cancel</button>
    <button class="btn btn-primary" onclick="saveType()">Save</button></div></div></div>

<script src="/assets/js/app.js"></script>
<script>
  initNav('intake-types');
  let types = [], editingCode = null;
  const escv = s => (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function showModal(id){ document.getElementById(id).classList.remove('hidden'); }
  function hideModal(id){ document.getElementById(id).classList.add('hidden'); }
  function val(id){ return document.getElementById(id).value.trim(); }
  function parseArr(s){ try{ const j=JSON.parse(s); return Array.isArray(j)?j:[]; }catch(e){ return []; } }

  async function reload(){
    types = await apiGet('/intake-types').catch(()=>[]) || [];
    document.getElementById('cards').innerHTML = types.length ? types.map(t=>{
      const st = parseArr(t.statuses);
      const chips = st.map((s,i)=>`<span class="badge badge-gray">${i+1}. ${escv(s)}</span>`).join(' ');
      return `<div class="card"><div class="card-body">
        <div class="flex items-center gap-2 mb-1">
          <span style="width:10px;height:10px;border-radius:50%;background:${escv(t.color)||'#64748b'};display:inline-block"></span>
          <span class="font-semibold text-base">${escv(t.name)}</span>
          <span class="font-mono text-xs text-slate-400">${escv(t.code)}</span>
          ${t.is_glp1?'<span class="badge badge-green">GLP-1</span>':''}
          ${t.active?'':'<span class="badge badge-gray">Inactive</span>'}
          <button class="btn btn-outline btn-sm ml-auto" onclick='openEdit(${JSON.stringify(t.code)})'>Edit</button></div>
        <p class="text-sm text-slate-500 mb-2">${escv(t.description)||''}</p>
        <div class="text-xs text-slate-400 uppercase tracking-wide mb-1">Lifecycle</div>
        <div class="flex flex-wrap gap-1">${chips||'<span class="text-slate-300 text-sm">No statuses defined</span>'}</div>
      </div></div>`;
    }).join('') : '<div class="text-slate-400 text-sm">No intake types yet.</div>';
  }

  function fill(t){
    editingCode = t.code || null;
    document.getElementById('t-title').textContent = t.code ? ('Edit '+t.name) : 'New Intake Type';
    document.getElementById('t-code').value = t.code || '';
    document.getElementById('t-code').disabled = !!t.code;
    document.getElementById('t-name').value = t.name || '';
    document.getElementById('t-description').value = t.description || '';
    document.getElementById('t-statuses').value = parseArr(t.statuses).join('\n');
    document.getElementById('t-sub').value = t.sub_statuses || '';
    document.getElementById('t-color').value = t.color || '';
    document.getElementById('t-sort').value = t.sort_order || 100;
    document.getElementById('t-glp').value = t.is_glp1 ? '1' : '0';
    document.getElementById('t-active').value = (t.active===0||t.active===false) ? '0' : '1';
    document.getElementById('t-del').style.display = t.code ? '' : 'none';
    showModal('tModal');
  }
  function openNew(){ fill({}); }
  function openEdit(code){ fill(types.find(t=>t.code===code)||{}); }

  async function saveType(){
    const statuses = val('t-statuses').split('\n').map(s=>s.trim()).filter(Boolean);
    let sub = val('t-sub'); if(sub){ try{ sub=JSON.parse(sub); }catch(e){ return showToast('Sub-statuses must be valid JSON','error'); } } else sub = {};
    const b = { code:val('t-code'), name:val('t-name'), description:val('t-description'),
      statuses, sub_statuses:sub, color:val('t-color')||null, sort_order:parseInt(val('t-sort'),10)||100,
      is_glp1:document.getElementById('t-glp').value==='1', active:document.getElementById('t-active').value==='1' };
    if(!b.code||!b.name) return showToast('Code and name required','error');
    const r = editingCode ? await apiPatch('/intake-types?code='+encodeURIComponent(editingCode),b) : await apiPost('/intake-types',b);
    if(r&&(r.ok||r.code)){ showToast('Saved'); hideModal('tModal'); reload(); } else showToast('Save failed','error');
  }
  async function delType(){
    if(!editingCode || !confirm('Delete this intake type?')) return;
    const r = await apiDelete('/intake-types?code='+encodeURIComponent(editingCode));
    if(r&&r.code){ showToast('Deleted'); hideModal('tModal'); reload(); }
  }
  reload();
</script>
</body>
</html>
