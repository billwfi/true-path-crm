<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leads — True Path CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="bg-slate-100 text-slate-700">
<div id="app" class="flex h-screen overflow-hidden">
  <div id="nav-placeholder"></div>
  <div class="flex-1 flex flex-col overflow-hidden">
    <div id="topbar"></div>
    <main class="flex-1 overflow-y-auto p-6">

      <div class="search-bar">
        <input type="text" id="search" class="form-control" placeholder="Search leads…" oninput="debounceLoad()">
        <div class="flex gap-2 ml-auto">
          <button class="btn btn-outline" id="view-list-btn" onclick="setView('list')"><i class="fa-solid fa-list"></i></button>
          <button class="btn btn-outline" id="view-kanban-btn" onclick="setView('kanban')"><i class="fa-solid fa-columns"></i></button>
          <button class="btn btn-primary" onclick="openNew()"><i class="fa-solid fa-plus"></i> New Lead</button>
        </div>
      </div>

      <div class="filter-bar">
        <button class="filter-btn active" data-status="" onclick="setFilter(this,'')">All</button>
        <button class="filter-btn" data-status="New" onclick="setFilter(this,'New')">New</button>
        <button class="filter-btn" data-status="Contacted" onclick="setFilter(this,'Contacted')">Contacted</button>
        <button class="filter-btn" data-status="Qualified" onclick="setFilter(this,'Qualified')">Qualified</button>
        <button class="filter-btn" data-status="Lost" onclick="setFilter(this,'Lost')">Lost</button>
        <button class="filter-btn" data-status="Converted" onclick="setFilter(this,'Converted')">Converted</button>
      </div>

      <!-- List view -->
      <div id="list-view">
        <div class="card">
          <div class="card-body">
            <table class="data-table">
              <thead><tr><th>#</th><th>Name</th><th>Company</th><th>Email</th><th>Phone</th><th>Value</th><th>Status</th><th>Source</th><th>Last Contact</th><th>Assigned</th></tr></thead>
              <tbody id="tbl-body"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Kanban view -->
      <div id="kanban-view" style="display:none">
        <div class="kanban-board" id="kanban-board"></div>
      </div>

    </main>
  </div>
</div>

<!-- Lead modal -->
<div id="lead-modal" class="modal-backdrop hidden">
  <div class="modal modal-lg">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">New Lead</span>
      <button class="modal-close" onclick="closeModal('lead-modal')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <div id="converted-banner" class="flex items-center gap-2 bg-emerald-50 border border-emerald-300 text-emerald-800 rounded-md px-4 py-2.5 mb-3 text-sm" style="display:none">
        <i class="fa-solid fa-circle-check"></i>
        <span>Converted to a client.</span>
        <a id="converted-link" class="btn btn-outline btn-sm ml-auto" href="#"><i class="fa-solid fa-folder-open"></i> Open Client</a>
      </div>
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Full Name *</label><input class="form-control" id="f-name"></div>
        <div class="form-group"><label class="form-label">Company</label><input class="form-control" id="f-company"></div>
        <div class="form-group"><label class="form-label">Email</label><input class="form-control" type="email" id="f-email"></div>
        <div class="form-group"><label class="form-label">Phone</label><input class="form-control" id="f-phone"></div>
        <div class="form-group"><label class="form-label">Value ($)</label><input class="form-control" type="number" id="f-value"></div>
        <div class="form-group"><label class="form-label">Status</label>
          <select class="form-control" id="f-status">
            <option>New</option><option>Contacted</option><option>Qualified</option><option>Lost</option><option>Converted</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Source</label>
          <select class="form-control" id="f-source">
            <option value="">— Select —</option>
            <option>Referral</option><option>Website</option><option>Cold Call</option><option>Event</option><option>Social Media</option><option>Other</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Last Contact</label><input class="form-control" type="date" id="f-last_contact"></div>
      </div>
      <div class="form-group"><label class="form-label">Tags</label><input class="form-control" id="f-tags" placeholder="comma-separated tags"></div>
      <div class="form-group"><label class="form-label">Notes</label><textarea class="form-control" id="f-notes" rows="3"></textarea></div>

      <!-- Contact tracking (existing leads only) -->
      <div id="contact-section" style="display:none">
        <div class="text-xs uppercase tracking-wide text-slate-500 mt-4 mb-2" style="border-bottom:1px solid #e2e8f0;padding-bottom:4px">
          Contact Efforts <span id="contact-count" class="text-slate-400"></span></div>
        <div class="flex flex-wrap items-end gap-2 mb-3">
          <input type="hidden" id="c-id">
          <div class="form-group mb-0"><label class="form-label">Type</label>
            <select class="form-control" id="c-type" style="max-width:130px">
              <option>Email</option><option>Phone</option><option>Meeting</option><option>Other</option>
            </select></div>
          <div class="form-group mb-0"><label class="form-label">Date</label><input type="date" class="form-control" id="c-date" style="max-width:150px"></div>
          <div class="form-group mb-0"><label class="form-label">Follow-up</label><input type="date" class="form-control" id="c-followup" style="max-width:150px"></div>
          <div class="form-group mb-0" style="flex:1;min-width:180px"><label class="form-label">Notes</label><input class="form-control" id="c-notes" placeholder="What happened…"></div>
          <button class="btn btn-primary btn-sm" onclick="saveContact()"><i class="fa-solid fa-plus"></i> <span id="c-save-label">Log</span></button>
          <button class="btn btn-outline btn-sm" id="c-cancel" onclick="resetContactForm()" style="display:none">Cancel</button>
        </div>
        <table class="data-table">
          <thead><tr><th>Date</th><th>Type</th><th>Notes</th><th>Follow-up</th><th></th></tr></thead>
          <tbody id="contact-body"></tbody>
        </table>
      </div>

      <!-- Opportunities (existing leads only) — convert to contracts + benefits -->
      <div id="opp-section" style="display:none">
        <div class="text-xs uppercase tracking-wide text-slate-500 mt-4 mb-2 flex items-center" style="border-bottom:1px solid #e2e8f0;padding-bottom:4px">
          <span>Opportunities <span id="opp-count" class="text-slate-400"></span></span>
          <button class="btn btn-outline btn-sm ml-auto" onclick="openOpp()"><i class="fa-solid fa-plus"></i> Add Opportunity</button>
        </div>
        <table class="data-table">
          <thead><tr><th>Opportunity</th><th>Value</th><th>Stage</th><th>Benefits</th><th></th></tr></thead>
          <tbody id="opp-body"></tbody>
        </table>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('lead-modal')">Cancel</button>
      <button class="btn btn-danger btn-sm" id="delete-btn" onclick="doDelete()" style="display:none">Delete</button>
      <button class="btn btn-success btn-sm" id="convert-btn" onclick="doConvert()" style="display:none"><i class="fa-solid fa-user-check"></i> Convert to Client</button>
      <button class="btn btn-primary" onclick="save()">Save</button>
    </div>
  </div>
</div>

<!-- Opportunity modal (fields + benefits) -->
<div id="opp-modal" class="modal-backdrop hidden">
  <div class="modal modal-lg">
    <div class="modal-header">
      <span class="modal-title" id="opp-title">New Opportunity</span>
      <button class="modal-close" onclick="closeModal('opp-modal')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="o-id">
      <div class="form-grid">
        <div class="form-group" style="grid-column:1/-1"><label class="form-label">Opportunity Name *</label><input class="form-control" id="o-name" placeholder="e.g. 2026 GLP-1 Program"></div>
        <div class="form-group"><label class="form-label">Estimated Value ($)</label><input class="form-control" type="number" id="o-value"></div>
        <div class="form-group"><label class="form-label">Stage</label>
          <select class="form-control" id="o-stage"><option>Open</option><option>Won</option><option>Lost</option></select></div>
        <div class="form-group"><label class="form-label">Effective Date</label><input class="form-control" type="date" id="o-eff"></div>
        <div class="form-group"><label class="form-label">Renewal / End Date</label><input class="form-control" type="date" id="o-end"></div>
      </div>
      <div class="form-group"><label class="form-label">Notes</label><textarea class="form-control" id="o-notes" rows="2"></textarea></div>

      <!-- Benefits -->
      <div id="obn-section" style="display:none">
        <div class="text-xs uppercase tracking-wide text-slate-500 mt-3 mb-2" style="border-bottom:1px solid #e2e8f0;padding-bottom:4px">
          Benefits <span id="obn-count" class="text-slate-400"></span></div>
        <div class="flex flex-wrap items-end gap-2 mb-3">
          <input type="hidden" id="ob-id">
          <div class="form-group mb-0" style="flex:1;min-width:150px"><label class="form-label">Benefit *</label><input class="form-control" id="ob-name" placeholder="e.g. GLP-1 Coverage"></div>
          <div class="form-group mb-0"><label class="form-label">Type</label>
            <select class="form-control" id="ob-type" style="max-width:110px" onchange="obnToggleGlp()"><option>iRx</option><option>GLP1</option></select></div>
          <div class="form-group mb-0"><label class="form-label">Coverage</label><input class="form-control" id="ob-coverage" style="max-width:130px" placeholder="e.g. 100%"></div>
          <div class="form-group mb-0"><label class="form-label">Value</label><input class="form-control" id="ob-value" style="max-width:120px"></div>
          <div class="form-group mb-0 obn-glp" style="display:none"><label class="form-label">Tirz $</label><input class="form-control" type="number" id="ob-tirz" style="max-width:100px"></div>
          <div class="form-group mb-0 obn-glp" style="display:none"><label class="form-label">Sema $</label><input class="form-control" type="number" id="ob-sema" style="max-width:100px"></div>
          <button class="btn btn-primary btn-sm" onclick="saveBenefit()"><i class="fa-solid fa-plus"></i> <span id="ob-save-label">Add</span></button>
          <button class="btn btn-outline btn-sm" id="ob-cancel" onclick="resetBenefitForm()" style="display:none">Cancel</button>
        </div>
        <table class="data-table">
          <thead><tr><th>Benefit</th><th>Type</th><th>Coverage</th><th>Value</th><th>GLP-1 $</th><th></th></tr></thead>
          <tbody id="obn-body"></tbody>
        </table>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('opp-modal')">Close</button>
      <button class="btn btn-danger btn-sm" id="opp-delete" onclick="deleteOpp()" style="display:none">Delete</button>
      <button class="btn btn-primary" onclick="saveOpp()">Save Opportunity</button>
    </div>
  </div>
</div>

<script src="/assets/js/app.js"></script>
<script>
  initNav('leads');
  let currentView = 'list', currentStatus = '', allLeads = [];
  let debounce;

  function debounceLoad() { clearTimeout(debounce); debounce = setTimeout(load, 300); }
  function setFilter(btn, status) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentStatus = status;
    load();
  }

  function setView(v) {
    currentView = v;
    document.getElementById('list-view').style.display   = v === 'list'   ? '' : 'none';
    document.getElementById('kanban-view').style.display = v === 'kanban' ? '' : 'none';
    renderData();
  }

  const STATUSES = ['New','Contacted','Qualified','Lost','Converted'];

  async function load() {
    const search = document.getElementById('search').value;
    let url = '/leads?';
    if (currentStatus) url += `status=${encodeURIComponent(currentStatus)}&`;
    if (search) url += `search=${encodeURIComponent(search)}`;
    const data = await apiGet(url);
    if (!data) return;
    allLeads = data;
    renderData();
  }

  function renderData() {
    if (currentView === 'list') renderList();
    else renderKanban();
  }

  function renderList() {
    document.getElementById('tbl-body').innerHTML = allLeads.length
      ? allLeads.map(l => `<tr class="clickable" onclick="openEdit(${l.id})">
          <td class="text-slate-400 font-mono text-xs">#${l.id}</td>
          <td class="font-medium">${esc(l.name)}</td>
          <td>${esc(l.company)||'—'}</td>
          <td>${esc(l.email)||'—'}</td>
          <td>${esc(l.phone)||'—'}</td>
          <td>${l.value ? fmtCurrency(l.value) : '—'}</td>
          <td>${statusBadge(l.status, LEAD_STATUS_COLORS)}</td>
          <td>${esc(l.source)||'—'}</td>
          <td class="text-xs text-slate-400">${fmtDate(l.last_contact)}</td>
          <td class="text-xs">${esc(l.assigned_name)||'—'}</td>
        </tr>`).join('')
      : '<tr><td colspan="10" class="text-center py-10 text-slate-400">No leads found</td></tr>';
  }

  function renderKanban() {
    const cols = {};
    STATUSES.forEach(s => cols[s] = []);
    allLeads.forEach(l => { if (cols[l.status]) cols[l.status].push(l); else cols['New'].push(l); });
    document.getElementById('kanban-board').innerHTML = STATUSES.map(s => `
      <div class="kanban-col">
        <div class="kanban-col-header">
          <span>${s}</span>
          <span class="text-xs font-mono">${cols[s].length}</span>
        </div>
        <div class="kanban-cards">
          ${cols[s].length ? cols[s].map(l => `
            <div class="kanban-card" onclick="openEdit(${l.id})">
              <div class="kanban-card-name">${esc(l.name)}</div>
              <div class="kanban-card-meta">${esc(l.company)||''}${l.value ? ' · ' + fmtCurrency(l.value) : ''}</div>
            </div>`).join('') : '<div class="text-xs text-slate-400 text-center py-4">Empty</div>'}
        </div>
      </div>`).join('');
  }

  function openNew() { clearForm(); openModal('lead-modal'); }

  function clearForm() {
    document.getElementById('edit-id').value = '';
    ['f-name','f-company','f-email','f-phone','f-value','f-last_contact','f-tags','f-notes'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-status').value = 'New';
    document.getElementById('f-source').value = '';
    document.getElementById('delete-btn').style.display = 'none';
    document.getElementById('convert-btn').style.display = 'none';
    document.getElementById('converted-banner').style.display = 'none';
    document.getElementById('contact-section').style.display = 'none';
    document.getElementById('opp-section').style.display = 'none';
    document.getElementById('modal-title').textContent = 'New Lead';
    resetContactForm();
  }

  async function openEdit(id) {
    clearForm();
    const l = await apiGet(`/leads?id=${id}`);
    if (!l) return;
    document.getElementById('edit-id').value       = l.id;
    document.getElementById('f-name').value        = l.name        || '';
    document.getElementById('f-company').value     = l.company     || '';
    document.getElementById('f-email').value       = l.email       || '';
    document.getElementById('f-phone').value       = l.phone       || '';
    document.getElementById('f-value').value       = l.value       || '';
    document.getElementById('f-status').value      = l.status      || 'New';
    document.getElementById('f-source').value      = l.source      || '';
    document.getElementById('f-last_contact').value= l.last_contact ? l.last_contact.slice(0,10) : '';
    document.getElementById('f-tags').value        = l.tags        || '';
    document.getElementById('f-notes').value       = l.notes       || '';
    document.getElementById('modal-title').textContent = `Edit — ${l.name}`;
    document.getElementById('delete-btn').style.display = '';

    // Convert / converted state
    if (l.converted_client_id) {
      document.getElementById('converted-banner').style.display = '';
      document.getElementById('converted-link').href = `/clients/record/?id=${l.converted_client_id}`;
    } else {
      document.getElementById('convert-btn').style.display = '';
    }
    // Contact tracking + opportunities
    document.getElementById('contact-section').style.display = '';
    document.getElementById('opp-section').style.display = '';
    loadContacts(l.id);
    loadOpps(l.id);
    openModal('lead-modal');
  }

  /* ── Contact efforts ── */
  function resetContactForm() {
    const set = (id, v) => { const e = document.getElementById(id); if (e) e.value = v; };
    set('c-id', ''); set('c-type', 'Email'); set('c-date', new Date().toISOString().slice(0, 10));
    set('c-followup', ''); set('c-notes', '');
    const lbl = document.getElementById('c-save-label'); if (lbl) lbl.textContent = 'Log';
    const cx = document.getElementById('c-cancel'); if (cx) cx.style.display = 'none';
  }

  async function loadContacts(leadId) {
    const rows = await apiGet(`/leads?resource=contacts&lead_id=${leadId}`) || [];
    document.getElementById('contact-count').textContent = rows.length ? `· ${rows.length}` : '';
    const TYPE_COLOR = { Email: 'blue', Phone: 'green', Meeting: 'purple', Other: 'gray' };
    document.getElementById('contact-body').innerHTML = rows.length
      ? rows.map(c => `<tr>
          <td class="text-xs whitespace-nowrap">${fmtDate(c.contact_date)}</td>
          <td><span class="badge badge-${TYPE_COLOR[c.contact_type] || 'gray'}">${esc(c.contact_type)}</span></td>
          <td class="text-sm">${esc(c.notes) || '—'}</td>
          <td class="text-xs">${c.followup_date ? fmtDate(c.followup_date) : '—'}</td>
          <td class="text-right whitespace-nowrap">
            <button class="btn btn-outline btn-sm" title="Edit" onclick='editContact(${JSON.stringify(c).replace(/'/g, "&#39;")})'><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-danger btn-sm" title="Delete" onclick="deleteContact(${c.id})"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>`).join('')
      : '<tr><td colspan="5" class="text-center py-5 text-slate-400">No contact efforts logged yet</td></tr>';
  }

  function editContact(c) {
    document.getElementById('c-id').value = c.id;
    document.getElementById('c-type').value = c.contact_type || 'Email';
    document.getElementById('c-date').value = c.contact_date ? String(c.contact_date).slice(0, 10) : '';
    document.getElementById('c-followup').value = c.followup_date ? String(c.followup_date).slice(0, 10) : '';
    document.getElementById('c-notes').value = c.notes || '';
    document.getElementById('c-save-label').textContent = 'Save';
    document.getElementById('c-cancel').style.display = '';
  }

  async function saveContact() {
    const leadId = document.getElementById('edit-id').value;
    if (!leadId) return;
    const cid = document.getElementById('c-id').value;
    const body = {
      contact_type: document.getElementById('c-type').value,
      contact_date: document.getElementById('c-date').value || null,
      followup_date: document.getElementById('c-followup').value || null,
      notes: document.getElementById('c-notes').value.trim() || null,
    };
    const res = cid
      ? await apiPatch(`/leads?resource=contact&id=${cid}`, body)
      : await apiPost(`/leads?resource=contact&lead_id=${leadId}`, body);
    if (res && res.ok) { showToast(cid ? 'Contact updated' : 'Contact logged', 'success'); resetContactForm(); loadContacts(leadId); load(); }
    else showToast('Save failed', 'error');
  }

  async function deleteContact(cid) {
    if (!confirm2('Delete this contact effort?')) return;
    const res = await apiDelete(`/leads?resource=contact&id=${cid}`);
    if (res && res.ok) { loadContacts(document.getElementById('edit-id').value); } else showToast('Delete failed', 'error');
  }

  async function doConvert() {
    const id = document.getElementById('edit-id').value;
    if (!id) return;
    if (!confirm2('Convert this lead to a client? This creates a client record (and a primary contact) and marks the lead Converted.')) return;
    const res = await apiPost(`/leads?action=convert&id=${id}`, {});
    if (res && res.ok) {
      const data = await res.json().catch(() => ({}));
      showToast('Lead converted to client', 'success');
      if (data.client_id) location.href = `/clients/record/?id=${data.client_id}`;
      else { closeModal('lead-modal'); load(); }
    } else showToast('Convert failed', 'error');
  }

  /* ── Opportunities (convert to contracts + benefits) ── */
  let leadOpps = [];
  const STAGE_BADGE = { Open: 'blue', Won: 'green', Lost: 'gray' };

  async function loadOpps(leadId) {
    leadOpps = await apiGet(`/leads?resource=opportunities&lead_id=${leadId}`) || [];
    document.getElementById('opp-count').textContent = leadOpps.length ? `· ${leadOpps.length}` : '';
    document.getElementById('opp-body').innerHTML = leadOpps.length
      ? leadOpps.map(o => `<tr>
          <td class="font-medium">${esc(o.name)}${o.converted_contract_id ? ' <span class="badge badge-green">→ contract</span>' : ''}</td>
          <td>${o.value != null ? fmtCurrency(o.value) : '—'}</td>
          <td><span class="badge badge-${STAGE_BADGE[o.stage] || 'gray'}">${esc(o.stage)}</span></td>
          <td class="text-xs text-slate-500">${(o.benefits || []).length}</td>
          <td class="text-right whitespace-nowrap">
            <button class="btn btn-outline btn-sm" onclick="openOpp(${o.id})"><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-danger btn-sm" onclick="deleteOpp(${o.id})"><i class="fa-solid fa-trash"></i></button>
          </td></tr>`).join('')
      : '<tr><td colspan="5" class="text-center py-5 text-slate-400">No opportunities yet</td></tr>';
  }

  function openOpp(id) {
    const o = id ? leadOpps.find(x => x.id === id) : null;
    document.getElementById('o-id').value = o ? o.id : '';
    document.getElementById('o-name').value = o ? o.name : '';
    document.getElementById('o-value').value = o && o.value != null ? o.value : '';
    document.getElementById('o-stage').value = o ? o.stage : 'Open';
    document.getElementById('o-eff').value = o && o.effective_date ? String(o.effective_date).slice(0, 10) : '';
    document.getElementById('o-end').value = o && o.end_date ? String(o.end_date).slice(0, 10) : '';
    document.getElementById('o-notes').value = o ? (o.notes || '') : '';
    document.getElementById('opp-title').textContent = o ? `Opportunity — ${o.name}` : 'New Opportunity';
    document.getElementById('opp-delete').style.display = o ? '' : 'none';
    document.getElementById('obn-section').style.display = o ? '' : 'none';  // benefits after the opp exists
    resetBenefitForm();
    renderBenefits(o ? (o.benefits || []) : []);
    openModal('opp-modal');
  }

  async function saveOpp() {
    const leadId = document.getElementById('edit-id').value;
    const oid = document.getElementById('o-id').value;
    const body = {
      name: document.getElementById('o-name').value.trim(),
      value: document.getElementById('o-value').value || null,
      stage: document.getElementById('o-stage').value,
      effective_date: document.getElementById('o-eff').value || null,
      end_date: document.getElementById('o-end').value || null,
      notes: document.getElementById('o-notes').value.trim() || null,
    };
    if (!body.name) { showToast('Opportunity name is required', 'error'); return; }
    const res = oid ? await apiPatch(`/leads?resource=opportunity&id=${oid}`, body)
                    : await apiPost(`/leads?resource=opportunity&lead_id=${leadId}`, body);
    if (!res || !res.ok) { showToast('Save failed', 'error'); return; }
    const row = await res.json().catch(() => ({}));
    showToast('Opportunity saved', 'success');
    await loadOpps(leadId);
    if (!oid && row.id) {   // new -> reveal benefits so they can be added now
      document.getElementById('o-id').value = row.id;
      document.getElementById('opp-title').textContent = `Opportunity — ${body.name}`;
      document.getElementById('opp-delete').style.display = '';
      document.getElementById('obn-section').style.display = '';
      renderBenefits([]);
    }
  }

  async function deleteOpp(id) {
    const oid = id || document.getElementById('o-id').value;
    if (!oid || !confirm2('Delete this opportunity and its benefits?')) return;
    const res = await apiDelete(`/leads?resource=opportunity&id=${oid}`);
    if (res && res.ok) { showToast('Deleted', 'success'); closeModal('opp-modal'); loadOpps(document.getElementById('edit-id').value); }
    else showToast('Delete failed', 'error');
  }

  /* Benefits within an opportunity */
  function obnToggleGlp() {
    const glp = document.getElementById('ob-type').value === 'GLP1';
    document.querySelectorAll('.obn-glp').forEach(e => e.style.display = glp ? '' : 'none');
  }
  function resetBenefitForm() {
    ['ob-id', 'ob-name', 'ob-coverage', 'ob-value', 'ob-tirz', 'ob-sema'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; });
    const t = document.getElementById('ob-type'); if (t) t.value = 'iRx';
    obnToggleGlp();
    const lbl = document.getElementById('ob-save-label'); if (lbl) lbl.textContent = 'Add';
    const cx = document.getElementById('ob-cancel'); if (cx) cx.style.display = 'none';
  }
  function renderBenefits(bens) {
    document.getElementById('obn-count').textContent = bens.length ? `· ${bens.length}` : '';
    document.getElementById('obn-body').innerHTML = bens.length
      ? bens.map(b => {
          const glp = [];
          if (b.tirzepatide_amount != null) glp.push('Tirz ' + fmtCurrency(b.tirzepatide_amount));
          if (b.semaglutide_amount != null) glp.push('Sema ' + fmtCurrency(b.semaglutide_amount));
          return `<tr>
            <td class="font-medium">${esc(b.name)}</td>
            <td><span class="badge badge-${b.type === 'GLP1' ? 'purple' : 'blue'}">${esc(b.type) || 'iRx'}</span></td>
            <td>${esc(b.coverage) || '—'}</td>
            <td>${esc(b.value) || '—'}</td>
            <td class="text-xs text-slate-500">${glp.join(' · ') || '—'}</td>
            <td class="text-right whitespace-nowrap">
              <button class="btn btn-outline btn-sm" onclick='editBenefit(${JSON.stringify(b).replace(/'/g, "&#39;")})'><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-danger btn-sm" onclick="deleteBenefit(${b.id})"><i class="fa-solid fa-trash"></i></button>
            </td></tr>`;
        }).join('')
      : '<tr><td colspan="6" class="text-center py-4 text-slate-400">No benefits yet</td></tr>';
  }
  function editBenefit(b) {
    document.getElementById('ob-id').value = b.id;
    document.getElementById('ob-name').value = b.name || '';
    document.getElementById('ob-type').value = b.type || 'iRx';
    document.getElementById('ob-coverage').value = b.coverage || '';
    document.getElementById('ob-value').value = b.value || '';
    document.getElementById('ob-tirz').value = b.tirzepatide_amount != null ? b.tirzepatide_amount : '';
    document.getElementById('ob-sema').value = b.semaglutide_amount != null ? b.semaglutide_amount : '';
    obnToggleGlp();
    document.getElementById('ob-save-label').textContent = 'Save';
    document.getElementById('ob-cancel').style.display = '';
  }
  async function saveBenefit() {
    const oid = document.getElementById('o-id').value;
    if (!oid) { showToast('Save the opportunity first', 'error'); return; }
    const bid = document.getElementById('ob-id').value;
    const body = {
      name: document.getElementById('ob-name').value.trim(),
      type: document.getElementById('ob-type').value,
      coverage: document.getElementById('ob-coverage').value.trim() || null,
      value: document.getElementById('ob-value').value.trim() || null,
      tirzepatide_amount: document.getElementById('ob-tirz').value || null,
      semaglutide_amount: document.getElementById('ob-sema').value || null,
    };
    if (!body.name) { showToast('Benefit name is required', 'error'); return; }
    const res = bid ? await apiPatch(`/leads?resource=opp-benefit&id=${bid}`, body)
                    : await apiPost(`/leads?resource=opp-benefit&opportunity_id=${oid}`, body);
    if (!res || !res.ok) { showToast('Save failed', 'error'); return; }
    showToast('Benefit saved', 'success');
    resetBenefitForm();
    await refreshOppBenefits(oid);
  }
  async function deleteBenefit(id) {
    if (!confirm2('Delete this benefit?')) return;
    const res = await apiDelete(`/leads?resource=opp-benefit&id=${id}`);
    if (res && res.ok) { await refreshOppBenefits(document.getElementById('o-id').value); } else showToast('Delete failed', 'error');
  }
  async function refreshOppBenefits(oid) {
    await loadOpps(document.getElementById('edit-id').value);
    const o = leadOpps.find(x => String(x.id) === String(oid));
    renderBenefits(o ? (o.benefits || []) : []);
  }
  document.getElementById('opp-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal('opp-modal'); });

  function getForm() {
    return {
      name: document.getElementById('f-name').value.trim(),
      company: document.getElementById('f-company').value.trim(),
      email: document.getElementById('f-email').value.trim(),
      phone: document.getElementById('f-phone').value.trim(),
      value: document.getElementById('f-value').value || null,
      status: document.getElementById('f-status').value,
      source: document.getElementById('f-source').value,
      last_contact: document.getElementById('f-last_contact').value || null,
      tags: document.getElementById('f-tags').value.trim(),
      notes: document.getElementById('f-notes').value.trim(),
    };
  }

  async function save() {
    const id = document.getElementById('edit-id').value;
    const body = getForm();
    if (!body.name) { showToast('Name is required', 'error'); return; }
    const res = id ? await apiPatch(`/leads?id=${id}`, body) : await apiPost('/leads', body);
    if (res && res.ok) { showToast(id ? 'Lead updated' : 'Lead created', 'success'); closeModal('lead-modal'); load(); }
    else showToast('Save failed', 'error');
  }

  async function doDelete() {
    const id = document.getElementById('edit-id').value;
    if (!id || !confirm2('Delete this lead?')) return;
    const res = await apiDelete(`/leads?id=${id}`);
    if (res && res.ok) { showToast('Deleted', 'success'); closeModal('lead-modal'); load(); }
    else showToast('Delete failed', 'error');
  }

  document.getElementById('lead-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal('lead-modal'); });
  (async () => {
    await load();
    const openId = new URLSearchParams(location.search).get('open');
    if (openId) openEdit(parseInt(openId, 10));  // deep-link from the Sales dashboard
  })();
</script>
</body>
</html>
