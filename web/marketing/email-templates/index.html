<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Templates — True Path CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <style>
    .tpl { border:1px solid #e2e8f0; border-radius:12px; background:#fff; margin-bottom:16px; overflow:hidden; }
    .tpl-head { display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid #eef2f4; }
    .tpl-head h3 { font-weight:640; color:#1e293b; }
    .tpl-body { padding:16px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media(max-width:820px){ .tpl-body{ grid-template-columns:1fr; } }
    .tpl-body label { font-size:12px; font-weight:600; color:#64748b; display:block; margin:0 0 4px; }
    .tpl-preview iframe { width:100%; height:480px; border:1px solid #e2e8f0; border-radius:8px; background:#f2f5f5; }
    .tpl-edit textarea { width:100%; height:410px; font:12px/1.5 ui-monospace,Consolas,monospace; }
    .lang { font:600 10.5px/1 ui-monospace; text-transform:uppercase; padding:4px 7px; border-radius:5px; background:#e0f2f1; color:#0a5e57; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">
<div id="app" class="flex h-screen overflow-hidden">
  <div id="nav-placeholder"></div>
  <div class="flex-1 flex flex-col overflow-hidden">
    <div id="topbar"></div>
    <main class="flex-1 overflow-y-auto p-6">
      <div class="search-bar">
        <span id="cfg" class="text-sm text-slate-500"></span>
        <button class="btn btn-outline btn-sm" onclick="load()"><i class="fa-solid fa-rotate"></i> Refresh</button>
      </div>
      <div id="tpl-list"></div>
    </main>
  </div>
</div>
<script src="/assets/js/app.js"></script>
<script>
  let TPLS = {};
  function mergePreview(h) {
    return String(h||'').replace(/\{\{\s*member_name\s*\}\}/g,'Member')
      .replace(/\{\{\s*unsubscribe_url\s*\}\}/g,'#');
  }
  async function load() {
    const cfg = await apiGet('/email') || {};
    document.getElementById('cfg').innerHTML = cfg.configured
      ? `Sending from <b>${esc(cfg.from)}</b> — edit copy, preview, and send yourself a test.`
      : '<span style="color:#b91c1c">Email not configured</span>';
    const tpls = await apiGet('/email?resource=templates') || [];
    TPLS = {}; tpls.forEach(t => TPLS[t.id] = t);
    document.getElementById('tpl-list').innerHTML = tpls.map(card).join('');
    tpls.forEach(t => { document.getElementById('frame-'+t.id).srcdoc = mergePreview(t.html_body); });
  }
  function card(t) {
    return `<div class="tpl">
      <div class="tpl-head">
        <span class="lang">${esc(t.language)}</span>
        <h3>${esc(t.name)}</h3>
        <div style="margin-left:auto;display:flex;gap:8px">
          <button class="btn btn-outline btn-sm" onclick="toggleEdit(${t.id})"><i class="fa-solid fa-pen"></i> Edit</button>
          <button class="btn btn-primary btn-sm" onclick="sendTest('${esc(t.tkey)}')"><i class="fa-solid fa-paper-plane"></i> Send test</button>
        </div>
      </div>
      <div class="tpl-body">
        <div class="tpl-preview">
          <label>Preview</label>
          <div style="margin-bottom:8px"><label>Subject</label>
            <input class="form-control" id="subj-${t.id}" value="${esc(t.subject)}"></div>
          <iframe id="frame-${t.id}" title="preview"></iframe>
        </div>
        <div class="tpl-edit" id="edit-${t.id}" style="display:none">
          <label>HTML (merge fields: {{member_name}}, {{unsubscribe_url}})</label>
          <textarea id="html-${t.id}">${esc(t.html_body)}</textarea>
          <div style="margin-top:8px"><button class="btn btn-primary btn-sm" onclick="save(${t.id})">Save changes</button></div>
        </div>
      </div>
    </div>`;
  }
  function toggleEdit(id) {
    const e = document.getElementById('edit-'+id);
    e.style.display = e.style.display === 'none' ? '' : 'none';
  }
  async function save(id) {
    const subject = document.getElementById('subj-'+id).value;
    const html_body = document.getElementById('html-'+id).value;
    const res = await apiPatch(`/email?resource=template&id=${id}`, { subject, html_body });
    if (res && res.ok) { showToast('Saved', 'success'); load(); } else showToast('Save failed', 'error');
  }
  async function sendTest(tkey) {
    const to = prompt('Send a test email to:');
    if (!to) return;
    showToast('Sending…');
    const res = await apiPost('/email?resource=test', { to, tkey });
    if (res && res.ok) showToast('Test sent to ' + to, 'success');
    else { const j = res ? await res.json().catch(()=>({})) : {}; showToast('Send failed: ' + (j.error||''), 'error'); }
  }
  initNav('marketing-email-templates');
  load();
</script>
</body>
</html>
