<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — True Path CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <style>
    /* projects list */
    table.plist { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.plist th { text-align: left; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: #94a3b8;
      text-transform: uppercase; padding: 8px 12px; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
    table.plist td { padding: 12px; border-bottom: 1px solid #f1f5f9; color: #475569; white-space: nowrap; }
    table.plist tr.prow:hover { background: #f8fafc; cursor: pointer; }
    .pname { font-weight: 650; color: #1e293b; font-size: 14px; }
    .badge2 { font-size: 10.5px; font-weight: 650; padding: 3px 9px; border-radius: 999px; }
    .b-active { background: #dbeafe; color: #1d4ed8; }
    .b-notstarted { background: #f1f5f9; color: #64748b; }
    .b-completed { background: #dcfce7; color: #15803d; }
    .prio-High { color: #b91c1c; font-weight: 700; }
    .prio-Medium { color: #64748b; font-weight: 600; }
    .prio-Low { color: #15803d; font-weight: 600; }
    .pbar { width: 150px; height: 7px; border-radius: 4px; background: #e2e8f0; overflow: hidden; display: inline-block; vertical-align: middle; }
    .pbar i { display: block; height: 100%; background: #0d7d74; }

    /* project detail header */
    .phead { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
    .phead .top { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
    .phead h1 { font-size: 22px; font-weight: 700; color: #1e293b; }
    .phead .meta { margin-left: auto; font-size: 12.5px; color: #475569; display: grid; grid-template-columns: auto auto; gap: 4px 22px; }
    .phead .meta i { color: #94a3b8; width: 15px; }
    .phead .prog { margin-top: 12px; display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: #64748b; }
    .phead .prog .bar { flex: 1; max-width: 420px; height: 8px; border-radius: 5px; background: #e2e8f0; overflow: hidden; }
    .phead .prog .bar i { display: block; height: 100%; background: #0d7d74; }
    .back { font-size: 13px; color: #7c3aed; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; }
    .back:hover { text-decoration: underline; }

    /* milestone → task → sub-task grid */
    .mig { display: flex; flex-direction: column; gap: 10px; }
    .ms { border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; overflow: hidden; }
    .ms-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
    .ms-head:hover { background: #f8fafc; }
    .ms-chev { color: #94a3b8; width: 13px; transition: transform .15s; }
    .ms.open .ms-chev { transform: rotate(90deg); }
    .ms-name { font-weight: 650; color: #1e293b; font-size: 15px; }
    .ms-focus { font-size: 12px; color: #94a3b8; font-weight: 400; margin-left: 8px; }
    .ms-dates { font-size: 12px; color: #475569; white-space: nowrap; }
    .ms-prog { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #64748b; white-space: nowrap; }
    .ms-prog .bar { width: 110px; height: 7px; border-radius: 4px; background: #e2e8f0; overflow: hidden; }
    .ms-prog .bar i { display: block; height: 100%; background: #15803d; }
    .ms-body { border-top: 1px solid #f1f5f9; padding: 4px 0 8px; display: none; }
    .ms.open .ms-body { display: block; }
    .grow { flex: 1; min-width: 0; }
    .tk-row { display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 34px; border-top: 1px solid #f8fafc; }
    .tk-row:hover { background: #f9fafb; }
    .st-row { padding-left: 62px; background: #fbfcfd; }
    .tk-chev { color: #cbd5e1; width: 12px; cursor: pointer; transition: transform .15s; }
    .tk-open > .tk-row .tk-chev { transform: rotate(90deg); }
    .mini-status { font-size: 11.5px; font-weight: 600; padding: 3px 7px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; cursor: pointer; }
    .tk-name { font-size: 13.5px; color: #1e293b; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st-row .tk-name { font-weight: 450; color: #334155; font-size: 13px; }
    .tk-meta { font-size: 11.5px; color: #94a3b8; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .tk-due input { font-size: 11.5px; border: 1px solid #e2e8f0; border-radius: 6px; padding: 2px 5px; color: #475569; background: #fff; }
    .icon-btn { background: none; border: 0; color: #94a3b8; cursor: pointer; font-size: 12.5px; padding: 3px 4px; }
    .icon-btn:hover { color: #0a5e57; }
    .icon-btn.del:hover { color: #b91c1c; }
    .tk-subs { display: none; }
    .tk.tk-open > .tk-subs { display: block; }
    .atts { padding: 4px 14px 6px 62px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .att-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; background: #eef2f7;
      border: 1px solid #e2e8f0; border-radius: 999px; padding: 3px 10px; color: #334155; }
    .att-chip a { color: #0a5e57; }
    .att-chip .x { color: #94a3b8; cursor: pointer; font-weight: 700; }
    .att-chip .x:hover { color: #b91c1c; }
    .strike > .tk-row .tk-name { text-decoration: line-through; color: #94a3b8; }
    .add-row { padding: 6px 34px; }
    .pp-link { font-size: 12px; color: #0a5e57; cursor: pointer; background: none; border: 0; padding: 0; }
    .pp-link:hover { text-decoration: underline; }
    .fld { margin-bottom: 12px; }
    .fld label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 4px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-700">
<div id="app" class="flex h-screen overflow-hidden">
  <div id="nav-placeholder"></div>
  <div class="flex-1 flex flex-col overflow-hidden">
    <div id="topbar"></div>
    <main class="flex-1 overflow-y-auto p-6">
      <div id="pp-view"></div>
    </main>
  </div>
</div>

<!-- project add+edit -->
<div id="proj-modal" class="modal-backdrop hidden">
  <div class="modal" style="max-width:480px">
    <div class="modal-header"><span id="pjm-heading">New Project</span>
      <button onclick="closeModal('proj-modal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body">
      <div class="fld"><label>Project name</label><input id="pjm-name" class="form-control"></div>
      <div style="display:flex; gap:10px">
        <div class="fld" style="flex:1"><label>Priority</label><select id="pjm-prio" class="form-control"><option>Low</option><option selected>Medium</option><option>High</option></select></div>
        <div class="fld" style="flex:1"><label>Status</label><select id="pjm-status" class="form-control"><option value="">Auto (from tasks)</option><option>Not Started</option><option>Active</option><option>Completed</option></select></div>
      </div>
      <div style="display:flex; gap:10px">
        <div class="fld" style="flex:1"><label>Lead</label><input id="pjm-lead" class="form-control"></div>
        <div class="fld" style="flex:1"><label>Dev Lead</label><input id="pjm-devlead" class="form-control"></div>
      </div>
      <div style="display:flex; gap:10px">
        <div class="fld" style="flex:1"><label>Start date</label><input type="date" id="pjm-start" class="form-control"></div>
        <div class="fld" style="flex:1"><label>Due date</label><input type="date" id="pjm-end" class="form-control"></div>
      </div>
      <div class="fld"><label>Description</label><textarea id="pjm-descr" class="form-control" rows="2"></textarea></div>
    </div>
    <div style="padding:14px; border-top:1px solid #eef2f7; text-align:right">
      <button class="btn btn-primary btn-sm" onclick="saveProjectModal()">Save</button>
    </div>
  </div>
</div>

<!-- milestone add+edit -->
<div id="ms-modal" class="modal-backdrop hidden">
  <div class="modal" style="max-width:480px">
    <div class="modal-header"><span id="msm-heading">Milestone</span>
      <button onclick="closeModal('ms-modal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body">
      <div class="fld"><label>Name</label><input id="msm-name" class="form-control"></div>
      <div class="fld"><label>Focus</label><textarea id="msm-focus" class="form-control" rows="2"></textarea></div>
      <div style="display:flex; gap:10px">
        <div class="fld" style="flex:1"><label>Start date</label><input type="date" id="msm-start" class="form-control"></div>
        <div class="fld" style="flex:1"><label>End date</label><input type="date" id="msm-end" class="form-control"></div>
      </div>
    </div>
    <div style="padding:14px; border-top:1px solid #eef2f7; text-align:right">
      <button class="btn btn-primary btn-sm" onclick="saveMsModal()">Save</button>
    </div>
  </div>
</div>

<!-- task / sub-task add+edit -->
<div id="task-modal" class="modal-backdrop hidden">
  <div class="modal" style="max-width:460px">
    <div class="modal-header"><span id="tm-heading">Task</span>
      <button onclick="closeModal('task-modal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body">
      <div class="fld"><label>Title</label><input id="tm-name" class="form-control" placeholder="What needs to be done?"></div>
      <div class="fld"><label>Assignee</label><input id="tm-assignee" class="form-control" placeholder="Name (optional)"></div>
      <div style="display:flex; gap:10px">
        <div class="fld" style="flex:1"><label>Due date</label><input type="date" id="tm-due" class="form-control"></div>
        <div class="fld" style="flex:1"><label>Status</label><select id="tm-status" class="form-control"></select></div>
      </div>
    </div>
    <div style="padding:14px; border-top:1px solid #eef2f7; text-align:right">
      <button class="btn btn-primary btn-sm" onclick="saveTaskModal()">Save</button>
    </div>
  </div>
</div>

<script src="/assets/js/app.js"></script>
<script>
  const S_COLORS = { 'Not Started':'#94a3b8', 'In Progress':'#2563eb', 'Testing':'#a16207', 'Blocked':'#b91c1c', 'Done':'#15803d' };
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let STATUSES = ['Not Started','In Progress','Testing','Blocked','Done'];
  let PROJECTS = [];
  let ALL_CATS = [];              // categories (milestones) with nested tasks
  let CURRENT = null;             // open project id, or null for the list
  let LIST_Q = '', LIST_STATUS = '';
  const OPEN_MS = new Set(), OPEN_TK = new Set(), ATT = {};
  const catsOf = pid => ALL_CATS.filter(c => c.project_id === pid && c.code !== 'FB');
  const findTask = id => { for (const m of ALL_CATS) { const t = (m.tasks||[]).find(x=>x.id===id); if (t) return t; } return null; };
  const fmtD = ymd => { if (!ymd) return '—'; const [y,m,d] = ymd.split('-'); return `${MONTHS[+m-1]} ${+d}, ${y}`; };
  const fmtRange = (sd, ed) => {
    const f = d => { if (!d) return '?'; const [y,m,day] = d.split('-'); return `${MONTHS[+m-1]} ${+day}`; };
    return (!sd && !ed) ? '<span style="color:#cbd5e1">no dates</span>' : `${f(sd)} – ${f(ed)}, ${(ed||sd).split('-')[0]}`;
  };
  const badgeClass = s => s === 'Active' ? 'b-active' : s === 'Completed' ? 'b-completed' : 'b-notstarted';

  function rollup(proj) {
    const cats = catsOf(proj.id);
    const tasks = cats.flatMap(c => c.tasks || []);
    const done = tasks.filter(t => t.status === 'Done').length;
    const total = tasks.length;
    let status = proj.status;
    if (!status) status = total === 0 ? 'Not Started'
      : done === total ? 'Completed'
      : (done > 0 || tasks.some(t => t.status !== 'Not Started')) ? 'Active' : 'Not Started';
    return { cats, tasks, done, total, pct: total ? Math.round(done/total*100) : 0, status };
  }

  async function loadPlan() {
    const data = await apiGet('/project-plan');
    if (!data) return;
    STATUSES = data.statuses || STATUSES;
    PROJECTS = data.projects || [];
    ALL_CATS = (data.categories || []).filter(c => c.code !== 'FB');
    render();
  }

  function render() { CURRENT ? renderDetail() : renderList(); }

  /* ───────────── Projects list ───────────── */
  function renderList() {
    const q = LIST_Q.toLowerCase();
    const rows = PROJECTS.map(p => ({ p, r: rollup(p) }))
      .filter(x => (!q || x.p.name.toLowerCase().includes(q)) && (!LIST_STATUS || x.r.status === LIST_STATUS));
    document.getElementById('pp-view').innerHTML = `
      <div class="search-bar" style="gap:10px; flex-wrap:wrap">
        <input id="pl-search" class="form-control" style="max-width:260px" placeholder="Search projects…" value="${esc(LIST_Q)}" oninput="LIST_Q=this.value; renderList()">
        <select class="form-control" style="max-width:170px" onchange="LIST_STATUS=this.value; renderList()">
          <option value="">All statuses</option>
          ${['Not Started','Active','Completed'].map(s=>`<option ${s===LIST_STATUS?'selected':''}>${s}</option>`).join('')}
        </select>
        <span class="text-sm text-slate-400">${rows.length} project${rows.length===1?'':'s'}</span>
        <a class="btn btn-outline btn-sm" href="/project-management/" style="margin-left:auto"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
        <button class="btn btn-primary btn-sm" onclick="openProjectModal({})"><i class="fa-solid fa-plus"></i> New Project</button>
      </div>
      <div class="card"><div class="card-body" style="padding:0; overflow-x:auto">
        <table class="plist"><thead><tr>
          <th>Project</th><th>Status</th><th>Priority</th><th>Lead</th><th>Dev Lead</th><th>Due</th><th>Progress</th><th>Tasks</th><th></th>
        </tr></thead><tbody>${rows.length ? rows.map(({p,r}) => `
          <tr class="prow" onclick="openProject(${p.id})">
            <td><span class="pname">${esc(p.name)}</span></td>
            <td><span class="badge2 ${badgeClass(r.status)}">${r.status}</span></td>
            <td><span class="prio-${p.priority||'Medium'}">${esc(p.priority||'Medium')}</span></td>
            <td>${p.lead?esc(p.lead):'—'}</td>
            <td>${p.dev_lead?esc(p.dev_lead):'—'}</td>
            <td>${fmtD(p.end_date)}</td>
            <td><span class="pbar"><i style="width:${r.pct}%"></i></span> <span style="font-size:11.5px;color:#64748b">${r.pct}%</span></td>
            <td>${r.done}/${r.total}</td>
            <td class="text-right"><button class="icon-btn" title="Edit project" onclick="event.stopPropagation();openProjectModal({id:${p.id}})"><i class="fa-solid fa-pen"></i></button></td>
          </tr>`).join('') : '<tr><td colspan="9" class="text-center py-10 text-slate-400">No projects yet.</td></tr>'}
        </tbody></table>
      </div></div>`;
  }

  function openProject(id) { CURRENT = id; history.pushState({ project:id }, '', '?project='+id); render(); }
  function backToList() { CURRENT = null; history.pushState({}, '', location.pathname); render(); }

  /* ───────────── Project detail ───────────── */
  function renderDetail() {
    const proj = PROJECTS.find(p => p.id === CURRENT);
    if (!proj) { backToList(); return; }
    const r = rollup(proj);
    const view = document.getElementById('pp-view');
    view.innerHTML = `
      <div class="back" onclick="backToList()"><i class="fa-solid fa-arrow-left"></i> All Projects</div>
      <div class="phead">
        <div class="top">
          <div>
            <h1>${esc(proj.name)}</h1>
            <div style="margin-top:6px; display:flex; align-items:center; gap:12px">
              <span class="badge2 ${badgeClass(r.status)}">${r.status}</span>
              <span class="prio-${proj.priority||'Medium'}">${esc(proj.priority||'Medium')} priority</span>
            </div>
            ${proj.description?`<div style="margin-top:8px; font-size:12.5px; color:#64748b; max-width:560px">${esc(proj.description)}</div>`:''}
          </div>
          <div class="meta">
            <div><i class="fa-regular fa-user"></i> Lead</div><div>${proj.lead?esc(proj.lead):'—'}</div>
            <div><i class="fa-solid fa-code"></i> Dev Lead</div><div>${proj.dev_lead?esc(proj.dev_lead):'—'}</div>
            <div><i class="fa-solid fa-flag"></i> Start</div><div>${fmtD(proj.start_date)}</div>
            <div><i class="fa-regular fa-calendar"></i> Due</div><div>${fmtD(proj.end_date)}</div>
            <div><i class="fa-solid fa-list-check"></i> Tasks</div><div>${r.done}/${r.total} done</div>
          </div>
        </div>
        <div class="prog"><span>Progress ${r.pct}%</span><span class="bar"><i style="width:${r.pct}%"></i></span>
          <button class="btn btn-outline btn-sm" onclick="openProjectModal({id:${proj.id}})"><i class="fa-solid fa-pen"></i> Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteProject(${proj.id})"><i class="fa-regular fa-trash-can"></i> Delete</button>
        </div>
      </div>
      <div class="mig">${r.cats.map(renderMilestone).join('')
        || '<div class="card"><div class="card-body text-center py-8 text-slate-400">No milestones yet.</div></div>'}</div>
      <div style="margin-top:10px"><button class="btn btn-outline btn-sm" onclick="openMsModal({})"><i class="fa-solid fa-plus"></i> Milestone</button></div>`;
    hydrateAtts();
  }

  function taskTree(m) {
    const tops = (m.tasks||[]).filter(t => !t.parent_task_id);
    const kids = {};
    (m.tasks||[]).filter(t => t.parent_task_id).forEach(t => (kids[t.parent_task_id] = kids[t.parent_task_id]||[]).push(t));
    return { tops, kids };
  }
  function renderMilestone(m) {
    const done = (m.tasks||[]).filter(t=>t.status==='Done').length;
    const pct = (m.tasks||[]).length ? Math.round(done/m.tasks.length*100) : 0;
    const { tops, kids } = taskTree(m);
    return `<div class="ms ${OPEN_MS.has(m.id)?'open':''}">
      <div class="ms-head" onclick="toggleMs(${m.id})">
        <i class="fa-solid fa-chevron-right ms-chev"></i>
        <div class="grow"><span class="ms-name">${esc(m.title)}</span>${m.goal?`<span class="ms-focus">${esc(m.goal)}</span>`:''}</div>
        <span class="ms-dates">${fmtRange(m.start_date, m.end_date)}</span>
        <span class="ms-prog"><span class="bar"><i style="width:${pct}%"></i></span>${done}/${(m.tasks||[]).length}</span>
        <button class="icon-btn" title="Edit milestone" onclick="event.stopPropagation();openMsModal({id:${m.id}})"><i class="fa-solid fa-pen"></i></button>
        <button class="icon-btn del" title="Delete milestone" onclick="event.stopPropagation();delCategory(${m.id})"><i class="fa-regular fa-trash-can"></i></button>
      </div>
      <div class="ms-body">
        ${tops.map(t=>renderTaskRow(t, kids[t.id]||[])).join('') || '<div style="padding:8px 34px;font-size:12.5px;color:#94a3b8">No tasks yet.</div>'}
        <div class="add-row"><button class="pp-link" onclick="openTaskModal({categoryId:${m.id}})"><i class="fa-solid fa-plus"></i> Add task</button></div>
      </div>
    </div>`;
  }
  function statusSel(t) {
    return `<select class="mini-status" style="color:${S_COLORS[t.status]||'#475569'}" onchange="quickStatus(${t.id}, this.value)">
      ${STATUSES.map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select>`;
  }
  const dueInput = t => `<span class="tk-due"><input type="date" value="${t.due_date||''}" onchange="quickDue(${t.id}, this.value)"></span>`;
  const attsBox = id => `<div class="atts" id="atts-${id}">${renderAttChips(id)}</div>`;

  function renderTaskRow(t, subs) {
    const attN = t.attachment_count || 0, subDone = subs.filter(s=>s.status==='Done').length;
    return `<div class="tk ${OPEN_TK.has(t.id)?'tk-open':''} ${t.status==='Done'?'strike':''}">
      <div class="tk-row">
        <i class="fa-solid fa-chevron-right tk-chev" onclick="toggleTk(${t.id})"></i>
        ${statusSel(t)}
        <span class="tk-name grow">${esc(t.title)}</span>
        ${t.assignee?`<span class="tk-meta"><i class="fa-regular fa-user"></i> ${esc(t.assignee)}</span>`:''}
        ${subs.length?`<span class="tk-meta"><i class="fa-solid fa-list-ul"></i> ${subDone}/${subs.length}</span>`:''}
        ${attN?`<span class="tk-meta"><i class="fa-solid fa-paperclip"></i> ${attN}</span>`:''}
        ${dueInput(t)}
        <button class="icon-btn" title="Add sub-task" onclick="openTaskModal({categoryId:${t.category_id}, parentId:${t.id}})"><i class="fa-solid fa-plus"></i></button>
        <button class="icon-btn" title="Edit" onclick="openTaskModal({task:${t.id}})"><i class="fa-solid fa-pen"></i></button>
        <button class="icon-btn del" title="Delete" onclick="delTask(${t.id})"><i class="fa-regular fa-trash-can"></i></button>
      </div>
      <div class="tk-subs">
        ${subs.map(renderSubRow).join('')}
        ${attsBox(t.id)}
        <div class="add-row" style="padding-left:62px">
          <button class="pp-link" onclick="openTaskModal({categoryId:${t.category_id}, parentId:${t.id}})"><i class="fa-solid fa-plus"></i> Sub-task</button>
          <button class="pp-link" style="margin-left:16px" onclick="pickFile(${t.id})"><i class="fa-solid fa-paperclip"></i> Attach document</button>
        </div>
      </div>
    </div>`;
  }
  function renderSubRow(s) {
    return `<div class="tk ${s.status==='Done'?'strike':''}">
      <div class="tk-row st-row">
        <i class="fa-solid fa-arrow-turn-up fa-rotate-90" style="color:#cbd5e1;font-size:10px"></i>
        ${statusSel(s)}
        <span class="tk-name grow">${esc(s.title)}</span>
        ${s.assignee?`<span class="tk-meta"><i class="fa-regular fa-user"></i> ${esc(s.assignee)}</span>`:''}
        ${s.attachment_count?`<span class="tk-meta"><i class="fa-solid fa-paperclip"></i> ${s.attachment_count}</span>`:''}
        ${dueInput(s)}
        <button class="icon-btn" title="Attach document" onclick="pickFile(${s.id})"><i class="fa-solid fa-paperclip"></i></button>
        <button class="icon-btn" title="Edit" onclick="openTaskModal({task:${s.id}})"><i class="fa-solid fa-pen"></i></button>
        <button class="icon-btn del" title="Delete" onclick="delTask(${s.id})"><i class="fa-regular fa-trash-can"></i></button>
      </div>
      ${attsBox(s.id)}
    </div>`;
  }
  function renderAttChips(id) {
    const list = ATT[id];
    if (list === undefined) return (findTask(id)?.attachment_count) ? '<span style="font-size:11px;color:#cbd5e1">loading…</span>' : '';
    if (!list.length) return '';
    return list.map(a => `<span class="att-chip"><i class="fa-regular fa-file"></i>
      <a href="#" onclick="downloadAtt(${a.id});return false" title="Download">${esc(a.filename)}</a>
      <span class="x" title="Remove" onclick="deleteAtt(${a.id}, ${id})">&times;</span></span>`).join('');
  }
  async function hydrateAtts() {
    const wanted = [];
    catsOf(CURRENT).forEach(m => {
      if (!OPEN_MS.has(m.id)) return;
      const { tops, kids } = taskTree(m);
      tops.filter(t=>OPEN_TK.has(t.id)).forEach(t => {
        [t, ...(kids[t.id]||[])].forEach(x => { if ((x.attachment_count>0) && ATT[x.id] === undefined) wanted.push(x.id); });
      });
    });
    for (const tid of wanted) {
      const d = await apiGet(`/project-plan?resource=attachments&task_id=${tid}`);
      ATT[tid] = (d && d.attachments) || [];
      const el = document.getElementById('atts-'+tid); if (el) el.innerHTML = renderAttChips(tid);
    }
  }
  function toggleMs(id) { OPEN_MS.has(id) ? OPEN_MS.delete(id) : OPEN_MS.add(id); render(); }
  function toggleTk(id) { OPEN_TK.has(id) ? OPEN_TK.delete(id) : OPEN_TK.add(id); render(); }

  async function quickStatus(id, status) {
    const t = findTask(id); if (t) t.status = status; render();
    const r = await apiPatch(`/project-plan?id=${id}`, { status });
    if (!(r && r.ok)) { showToast('Could not update', 'error'); loadPlan(); }
  }
  async function quickDue(id, due_date) {
    const t = findTask(id); if (t) t.due_date = due_date || null;
    const r = await apiPatch(`/project-plan?id=${id}`, { due_date: due_date || null });
    if (!(r && r.ok)) showToast('Could not update', 'error');
  }

  /* project modal */
  let PJM = {};
  function openProjectModal(opts) {
    PJM = opts || {};
    const p = PJM.id ? PROJECTS.find(x=>x.id===PJM.id) : null;
    document.getElementById('pjm-heading').textContent = p ? 'Edit project' : 'New project';
    document.getElementById('pjm-name').value = p ? p.name : '';
    document.getElementById('pjm-prio').value = p ? (p.priority||'Medium') : 'Medium';
    document.getElementById('pjm-status').value = p ? (p.status||'') : '';
    document.getElementById('pjm-lead').value = p ? (p.lead||'') : '';
    document.getElementById('pjm-devlead').value = p ? (p.dev_lead||'') : '';
    document.getElementById('pjm-start').value = p ? (p.start_date||'') : '';
    document.getElementById('pjm-end').value = p ? (p.end_date||'') : '';
    document.getElementById('pjm-descr').value = p ? (p.description||'') : '';
    openModal('proj-modal');
    setTimeout(()=>document.getElementById('pjm-name').focus(), 40);
  }
  async function saveProjectModal() {
    const name = document.getElementById('pjm-name').value.trim();
    if (!name) { showToast('Project name required', 'error'); return; }
    const payload = { name, priority: document.getElementById('pjm-prio').value,
      status: document.getElementById('pjm-status').value || null,
      lead: document.getElementById('pjm-lead').value.trim() || null,
      dev_lead: document.getElementById('pjm-devlead').value.trim() || null,
      start_date: document.getElementById('pjm-start').value || null,
      end_date: document.getElementById('pjm-end').value || null,
      description: document.getElementById('pjm-descr').value.trim() || null };
    if (!PJM.id) payload.sort_order = Math.max(0, ...PROJECTS.map(p=>p.sort_order||0)) + 1;
    const r = PJM.id ? await apiPatch(`/project-plan?resource=project&id=${PJM.id}`, payload)
                     : await apiPost('/project-plan?resource=project', payload);
    if (r && r.ok) { closeModal('proj-modal'); showToast('Saved', 'success'); await loadPlan(); }
    else showToast('Could not save', 'error');
  }
  async function deleteProject(id) {
    const proj = PROJECTS.find(p=>p.id===id); const r = proj ? rollup(proj) : { total:0 };
    if (!confirm2(`Delete "${proj?proj.name:'project'}" and its ${r.total} task(s)? This cannot be undone.`)) return;
    const res = await apiDelete(`/project-plan?resource=project&id=${id}`);
    if (res && res.ok) { backToList(); await loadPlan(); } else showToast('Could not delete', 'error');
  }

  /* milestone modal */
  let MSM = {};
  function openMsModal(opts) {
    MSM = opts || {};
    const m = MSM.id ? ALL_CATS.find(c=>c.id===MSM.id) : null;
    document.getElementById('msm-heading').textContent = m ? 'Edit milestone' : 'New milestone';
    document.getElementById('msm-name').value = m ? m.title : '';
    document.getElementById('msm-focus').value = m ? (m.goal||'') : '';
    document.getElementById('msm-start').value = m ? (m.start_date||'') : '';
    document.getElementById('msm-end').value = m ? (m.end_date||'') : '';
    openModal('ms-modal');
  }
  async function saveMsModal() {
    const title = document.getElementById('msm-name').value.trim();
    if (!title) { showToast('Name required', 'error'); return; }
    const payload = { title,
      goal: document.getElementById('msm-focus').value.trim() || null,
      start_date: document.getElementById('msm-start').value || null,
      end_date: document.getElementById('msm-end').value || null };
    let r;
    if (MSM.id) r = await apiPatch(`/project-plan?resource=category&id=${MSM.id}`, payload);
    else { payload.project_id = CURRENT;
      payload.sort_order = Math.max(0, ...catsOf(CURRENT).map(c=>c.sort_order||0)) + 1;
      r = await apiPost('/project-plan?resource=category', payload); }
    if (r && r.ok) { closeModal('ms-modal'); await loadPlan(); } else showToast('Could not save', 'error');
  }
  async function delCategory(id) {
    if (!confirm2('Delete this milestone and its tasks?')) return;
    const r = await apiDelete(`/project-plan?resource=category&id=${id}`);
    if (r && r.ok) loadPlan(); else showToast('Could not delete', 'error');
  }

  /* task / sub-task modal */
  let TM = {};
  function openTaskModal(opts) {
    TM = opts || {};
    const t = TM.task ? findTask(TM.task) : null;
    document.getElementById('tm-heading').textContent = t ? 'Edit item' : (TM.parentId ? 'New sub-task' : 'New task');
    document.getElementById('tm-name').value = t ? t.title : '';
    document.getElementById('tm-assignee').value = t ? (t.assignee||'') : '';
    document.getElementById('tm-due').value = t ? (t.due_date||'') : '';
    document.getElementById('tm-status').innerHTML = STATUSES.map(s=>`<option ${t&&s===t.status?'selected':''}>${s}</option>`).join('');
    openModal('task-modal');
    setTimeout(()=>document.getElementById('tm-name').focus(), 40);
  }
  async function saveTaskModal() {
    const title = document.getElementById('tm-name').value.trim();
    if (!title) { showToast('Title required', 'error'); return; }
    const payload = { title,
      assignee: document.getElementById('tm-assignee').value.trim() || null,
      due_date: document.getElementById('tm-due').value || null,
      status: document.getElementById('tm-status').value };
    let r;
    if (TM.task) r = await apiPatch(`/project-plan?id=${TM.task}`, payload);
    else {
      payload.category_id = TM.categoryId;
      if (TM.parentId) { payload.parent_task_id = TM.parentId; OPEN_TK.add(TM.parentId); }
      OPEN_MS.add(TM.categoryId);
      r = await apiPost('/project-plan', payload);
    }
    if (r && r.ok) { closeModal('task-modal'); await loadPlan(); } else showToast('Could not save', 'error');
  }
  async function delTask(id) {
    if (!confirm2('Delete this item and any sub-tasks?')) return;
    const r = await apiDelete(`/project-plan?id=${id}`);
    if (r && r.ok) loadPlan(); else showToast('Could not delete', 'error');
  }

  /* attachments */
  function pickFile(taskId) {
    const inp = document.createElement('input'); inp.type = 'file';
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      if (f.size > 8 * 1024 * 1024) { showToast('File too large (max 8MB)', 'error'); return; }
      const data_b64 = await new Promise(res => { const rd = new FileReader(); rd.onload = () => res(rd.result.split(',')[1]); rd.readAsDataURL(f); });
      showToast('Uploading…');
      const r = await apiPost('/project-plan?resource=attachment', { task_id: taskId, filename: f.name, content_type: f.type, size_bytes: f.size, data_b64 });
      if (r && r.ok) { const t = findTask(taskId); if (t) t.attachment_count = (t.attachment_count||0)+1; delete ATT[taskId]; render(); showToast('Attached', 'success'); }
      else showToast('Upload failed', 'error');
    };
    inp.click();
  }
  async function downloadAtt(id) {
    const d = await apiGet(`/project-plan?resource=attachment&id=${id}`);
    if (!d || !d.data_b64) { showToast('Not found', 'error'); return; }
    const bytes = Uint8Array.from(atob(d.data_b64), c => c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], { type: d.content_type || 'application/octet-stream' }));
    const a = document.createElement('a'); a.href = url; a.download = d.filename || 'download'; a.click(); URL.revokeObjectURL(url);
  }
  async function deleteAtt(id, taskId) {
    if (!confirm2('Remove this document?')) return;
    const r = await apiDelete(`/project-plan?resource=attachment&id=${id}`);
    if (r && r.ok) { const t = findTask(taskId); if (t) t.attachment_count = Math.max(0,(t.attachment_count||1)-1); delete ATT[taskId]; render(); }
    else showToast('Could not remove', 'error');
  }

  window.onpopstate = () => { const u = new URLSearchParams(location.search); CURRENT = u.get('project') ? parseInt(u.get('project'),10) : null; render(); };

  initNav('project-plan');
  (function init(){ const u = new URLSearchParams(location.search); CURRENT = u.get('project') ? parseInt(u.get('project'),10) : null; loadPlan(); })();
</script>
</body>
</html>
