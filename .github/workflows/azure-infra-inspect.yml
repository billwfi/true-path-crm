name: Azure Infra Inspect

# Read-only: gather the facts needed to plan a static-egress migration for the
# prod web app (VNet/NAT config of both environments, the web app's ingress +
# custom domains + env/secret names to replicate).
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect
        run: |
          az extension add --upgrade --name containerapp -y 2>/dev/null || true
          RG=rg-tpcrm-prod
          echo "===== ENV: cae-tpcrm-prod (current web env) ====="
          az containerapp env show -n cae-tpcrm-prod -g $RG \
            --query "{internal:properties.vnetConfiguration.internal, infraSubnet:properties.vnetConfiguration.infrastructureSubnetId, staticIp:properties.staticIp, workloadProfiles:properties.workloadProfiles[].name}" -o jsonc || true
          echo "===== ENV: cae-tpcrm-jobs (has static NAT 104.46.113.57) ====="
          az containerapp env show -n cae-tpcrm-jobs -g $RG \
            --query "{internal:properties.vnetConfiguration.internal, infraSubnet:properties.vnetConfiguration.infrastructureSubnetId, staticIp:properties.staticIp, workloadProfiles:properties.workloadProfiles[].name}" -o jsonc || true
          echo "===== APP: ca-tpcrm-prod ingress + domains ====="
          az containerapp show -n ca-tpcrm-prod -g $RG \
            --query "{fqdn:properties.configuration.ingress.fqdn, external:properties.configuration.ingress.external, targetPort:properties.configuration.ingress.targetPort, customDomains:properties.configuration.ingress.customDomains[].name, env:properties.environmentId}" -o jsonc || true
          echo "===== APP: ca-tpcrm-prod env var NAMES (values hidden) ====="
          az containerapp show -n ca-tpcrm-prod -g $RG \
            --query "properties.template.containers[0].env[].name" -o tsv || true
          echo "===== APP: ca-tpcrm-prod secret NAMES ====="
          az containerapp secret list -n ca-tpcrm-prod -g $RG --query "[].name" -o tsv || true
