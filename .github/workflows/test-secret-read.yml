name: Test Secret Read

# Read-only probe: can the deploy service principal read Container App secret VALUES?
# Prints only each secret's name + value length (never the value).
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Probe
        run: |
          az extension add --upgrade --name containerapp -y 2>/dev/null || true
          for S in acs-connection-string admin-password import-crypt-key jwt-secret sqlserver-password pbm-intake-key; do
            V=$(az containerapp secret show -n ca-tpcrm-prod -g rg-tpcrm-prod --secret-name "$S" --query value -o tsv 2>&1)
            RC=$?
            if [ $RC -ne 0 ]; then
              echo "$S -> ERROR: $(echo "$V" | head -1 | cut -c1-80)"
            else
              echo "$S -> length=${#V}"
            fi
          done
