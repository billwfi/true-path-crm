name: Test Recap Send
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Start the daily recap job and show its log
        run: |
          az extension add --upgrade --name containerapp -y 2>/dev/null || true
          az containerapp job start -n caj-tpcrm-bookings-daily -g rg-tpcrm-prod -o none
          echo "started; waiting for it to finish..."
          for i in $(seq 1 30); do
            EX=$(az containerapp job execution list -n caj-tpcrm-bookings-daily -g rg-tpcrm-prod \
                  --query "sort_by([],&properties.startTime)[-1].{n:name,s:properties.status}" -o json)
            NAME=$(echo "$EX" | python3 -c "import json,sys;print(json.load(sys.stdin)['n'])")
            ST=$(echo "$EX" | python3 -c "import json,sys;print(json.load(sys.stdin)['s'])")
            echo "  $NAME -> $ST"
            [ "$ST" = "Succeeded" ] || [ "$ST" = "Failed" ] && break
            sleep 12
          done
          echo "--- console log ---"
          az containerapp job logs show -n caj-tpcrm-bookings-daily -g rg-tpcrm-prod \
            --execution "$NAME" --container bookings-daily --tail 60 2>/dev/null || \
          az containerapp job logs show -n caj-tpcrm-bookings-daily -g rg-tpcrm-prod \
            --execution "$NAME" --tail 60 2>/dev/null || echo "(log fetch unavailable)"
