name: Job Envs

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  envs:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Show each job's environment + ACS presence
        run: |
          az extension add --upgrade --name containerapp -y 2>/dev/null || true
          for J in caj-tpcrm-campaign caj-tpcrm-import-monday-nat caj-tpcrm-liviniti-nat caj-tpcrm-bookings-daily; do
            ENVID=$(az containerapp job show -n "$J" -g rg-tpcrm-prod --query "properties.environmentId" -o tsv 2>/dev/null)
            ACS=$(az containerapp job show -n "$J" -g rg-tpcrm-prod --query "length(properties.template.containers[0].env[?name=='ACS_CONNECTION_STRING'])" -o tsv 2>/dev/null)
            echo "$J -> env=$(basename "${ENVID:-none})")  ACS_env_var=$ACS"
          done
