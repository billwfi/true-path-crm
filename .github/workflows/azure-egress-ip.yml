name: Azure Egress IP

# Read-only: report the inbound + outbound public IPs of the prod web Container App
# (the outbound IPs are what the external SQL Server firewall must allowlist).
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ip:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Web app + env IPs
        run: |
          az extension add --upgrade --name containerapp -y 2>/dev/null || true
          echo "=== ca-tpcrm-prod (web app) ==="
          az containerapp show -n ca-tpcrm-prod -g rg-tpcrm-prod \
            --query "{outboundIps:properties.outboundIpAddresses, env:properties.environmentId}" -o jsonc || true
          ENVID=$(az containerapp show -n ca-tpcrm-prod -g rg-tpcrm-prod --query "properties.environmentId" -o tsv)
          ENVNAME=$(basename "$ENVID")
          echo "=== managed environment: $ENVNAME ==="
          az containerapp env show -n "$ENVNAME" -g rg-tpcrm-prod \
            --query "{staticIp:properties.staticIp, vnet:properties.vnetConfiguration}" -o jsonc || true
