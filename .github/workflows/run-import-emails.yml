name: Run Import Emails

# Manually send the per-client SFTP-import notification emails (via ACS) for a given
# date. Runs scripts/import_daily_email.py as a one-off execution on an existing jobs
# container that already carries ACS + DB credentials (caj-tpcrm-liviniti-nat), using
# the MFA-exempt service principal.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Processed-files date YYYY-MM-DD (blank = yesterday)'
        required: false
        default: ''

env:
  JOB: caj-tpcrm-liviniti-nat
  RG: rg-tpcrm-prod

permissions:
  id-token: write
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect job container spec (diagnostic)
        run: |
          az extension add --upgrade --name containerapp -y 2>/dev/null || true
          echo "=== $JOB container[0] command/args/image ==="
          az containerapp job show -n "$JOB" -g "$RG" \
            --query "properties.template.containers[0].{command:command, args:args, image:image}" -o json
