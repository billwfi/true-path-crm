name: Deploy to Azure Container Apps

# Build both images once (web + jobs), then promote the web app dev -> staging ->
# prod. dev deploys automatically; staging and prod each wait for approval
# (GitHub Environments "staging"/"prod" required reviewers). After prod is
# approved, the Container Apps Jobs are updated to the new jobs image too — so
# script changes ship automatically (the OIDC service principal is MFA-exempt,
# unlike a local `az containerapp job update`).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC federated login to Azure (no stored secret)
  contents: read

env:
  ACR: acrtpcrm
  ACR_LOGIN_SERVER: acrtpcrm.azurecr.io
  IMAGE_REPO: tpcrm
  JOBS_REPO: tpcrm-jobs

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build & push web image in ACR (server-side, no local Docker)
        run: |
          az acr build --registry "$ACR" \
            --image "$IMAGE_REPO:${{ steps.meta.outputs.tag }}" \
            --image "$IMAGE_REPO:latest" -f Dockerfile .
      - name: Build & push jobs image in ACR
        run: |
          az acr build --registry "$ACR" \
            --image "$JOBS_REPO:${{ steps.meta.outputs.tag }}" \
            --image "$JOBS_REPO:latest" -f deploy/jobs/Dockerfile .

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Update ca-tpcrm-dev
        run: |
          az containerapp update -n ca-tpcrm-dev -g rg-tpcrm-dev \
            --image "$ACR_LOGIN_SERVER/$IMAGE_REPO:${{ needs.build.outputs.tag }}"

  deploy-staging:
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    environment: staging   # requires approval
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Update ca-tpcrm-staging
        run: |
          az containerapp update -n ca-tpcrm-staging -g rg-tpcrm-staging \
            --image "$ACR_LOGIN_SERVER/$IMAGE_REPO:${{ needs.build.outputs.tag }}"

  deploy-prod:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: prod      # requires approval
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Update ca-tpcrm-web (prod, in the VNet/NAT env for static SQL egress)
        run: |
          az containerapp update -n ca-tpcrm-web -g rg-tpcrm-prod \
            --image "$ACR_LOGIN_SERVER/$IMAGE_REPO:${{ needs.build.outputs.tag }}"

  # Point every Container Apps Job at the freshly-built jobs image. Runs after prod
  # is approved (so jobs move in lockstep with the web app). The service principal
  # can do this even though a local `az containerapp job update` is MFA-blocked.
  deploy-jobs:
    needs: [build, deploy-prod]
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Update Container Apps Jobs to the new jobs image
        run: |
          IMG="$ACR_LOGIN_SERVER/$JOBS_REPO:${{ needs.build.outputs.tag }}"
          for J in caj-tpcrm-import-monday-nat caj-tpcrm-bookings-daily \
                   caj-tpcrm-liviniti-nat caj-tpcrm-anders-nat \
                   caj-tpcrm-sms-watch caj-tpcrm-campaign caj-tpcrm-campaign-rx \
                   caj-tpcrm-imports; do
            echo "::group::$J -> $IMG"
            az containerapp job update -n "$J" -g rg-tpcrm-prod --image "$IMG" -o none \
              || echo "WARN: could not update $J (skipped)"
            echo "::endgroup::"
          done
