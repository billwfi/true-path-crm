name: Finish Cert Bind

# The managed cert for app.truepathsourcing.com was created but was still provisioning
# when bind first ran. Poll it to Succeeded, then bind the hostname to it.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RG: rg-tpcrm-prod
  APP: ca-tpcrm-web
  ENVN: cae-tpcrm-jobs
  HOST: app.truepathsourcing.com

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Poll cert + bind
        run: |
          set -e
          az extension add --upgrade --name containerapp -y 2>/dev/null || true

          CERT=$(az containerapp env certificate list -n "$ENVN" -g "$RG" --managed-certificates-only \
                   --query "[?properties.subjectName=='$HOST'].name | [0]" -o tsv)
          echo "managed cert: ${CERT:-<none found>}"
          [ -z "$CERT" ] && { echo "no managed cert for $HOST"; exit 1; }

          for i in $(seq 1 24); do
            ST=$(az containerapp env certificate list -n "$ENVN" -g "$RG" --managed-certificates-only \
                   --query "[?name=='$CERT'].properties.provisioningState | [0]" -o tsv)
            echo "  [$i] cert state: ${ST}"
            case "$ST" in
              Succeeded) break;;
              Failed|Canceled|DeleteFailed) echo "cert provisioning $ST"; exit 1;;
            esac
            sleep 30
          done

          CERTID=$(az containerapp env certificate list -n "$ENVN" -g "$RG" --managed-certificates-only \
                     --query "[?name=='$CERT'].id | [0]" -o tsv)
          echo "=== binding cert to hostname ==="
          az containerapp hostname bind -n "$APP" -g "$RG" --hostname "$HOST" --certificate "$CERTID" -o table

          echo "=== resulting bindings ==="
          az containerapp show -n "$APP" -g "$RG" \
            --query "properties.configuration.ingress.customDomains[].{name:name, binding:bindingType}" -o jsonc
