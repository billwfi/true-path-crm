name: Set PGP Secrets on Import Job

# One-off: push the feed PGP private key + passphrase (held as GitHub encrypted
# secrets) onto the config-driven import job as Container App secrets, and expose
# them to the container as env vars via secretref. The import worker uses them to
# decrypt PGP-encrypted files (e.g. the Protein Management Group SFTP feed).
# Re-run any time the key is rotated.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  JOB: caj-tpcrm-import-monday-nat
  RG: rg-tpcrm-prod

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Set job secrets + env refs
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          az extension add --upgrade --name containerapp -y 2>/dev/null || true
          # Store as Container App secrets (encrypted at rest on the job).
          az containerapp job secret set -n "$JOB" -g "$RG" -o none \
            --secrets pgp-private-key="$PGP_PRIVATE_KEY" pgp-passphrase="$PGP_PASSPHRASE"
          # Expose to the container by secret reference (values never inlined in config).
          az containerapp job update -n "$JOB" -g "$RG" -o none \
            --set-env-vars PGP_PRIVATE_KEY=secretref:pgp-private-key PGP_PASSPHRASE=secretref:pgp-passphrase
          echo "PGP secrets set on $JOB; env vars reference them via secretref."
          # Confirm the env refs exist (names only; values are not printed).
          az containerapp job show -n "$JOB" -g "$RG" \
            --query "properties.template.containers[0].env[?name=='PGP_PRIVATE_KEY' || name=='PGP_PASSPHRASE'].name" -o tsv
