name: Scheduled Resend 08/31 Import Emails

# One-shot: resend the 08/31 per-client import emails after the ACS hourly send
# quota resets. Now that the "skip spam filtering" mail-flow rule is in place, these
# should reach every internal member's inbox. Timed for 2026-09-02 17:33 UTC
# (12:33 CDT) — well after the 10am-CT rebrand campaign so the shared ACS hourly
# send quota has recovered. Fires once this year; also runnable on demand.
on:
  schedule:
    - cron: '33 17 2 9 *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  JOB: caj-tpcrm-campaign
  RG: rg-tpcrm-prod
  EMAIL_DATE: '2026-08-31'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Repoint, send, revert
        id: run
        run: |
          az extension add --upgrade --name containerapp -y 2>/dev/null || true
          ORIG=$(az containerapp job show -n "$JOB" -g "$RG" \
            --query "properties.template.containers[0].env[?name=='PIPELINE'].value | [0]" -o tsv)
          ORIG=${ORIG:-campaign}
          echo "orig_pipeline=$ORIG" >> "$GITHUB_OUTPUT"

          az containerapp job update -n "$JOB" -g "$RG" -o none \
            --set-env-vars PIPELINE=import-email EMAIL_DATE="$EMAIL_DATE"
          EXEC=$(az containerapp job start -n "$JOB" -g "$RG" --query name -o tsv)
          echo "Started execution: $EXEC"
          for i in $(seq 1 40); do
            ST=$(az containerapp job execution list -n "$JOB" -g "$RG" \
                   --query "[?name=='$EXEC'].properties.status | [0]" -o tsv 2>/dev/null)
            echo "  execution status: ${ST:-<pending>}"
            case "$ST" in Succeeded|Failed|Degraded) break;; esac
            sleep 12
          done
          echo "Final: $ST"
          [ "$ST" = "Succeeded" ]
      - name: Restore PIPELINE (always)
        if: always()
        run: |
          ORIG="${{ steps.run.outputs.orig_pipeline }}"; ORIG=${ORIG:-campaign}
          az containerapp job update -n "$JOB" -g "$RG" -o none \
            --set-env-vars PIPELINE="$ORIG" EMAIL_DATE=""
          echo "Restored PIPELINE=$ORIG"
